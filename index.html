<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VAULT</title>
<meta name="description" content="売上・経費・人件費をまとめて記録し、利益がひと目で分かる経営アプリ">
<meta name="theme-color" content="#0b1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAULT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>

/* 構成：精密な背景（同心円・回路・粒子）の上に、情報だけが浮かぶ3層。上＝サマリー、中＝推移、下＝経営指標。下部に固定ナビと中央の追加ボタン */
:root{
  --bg:#05070b; --char:#0d1117; --navy:#0a1324;
  --ink:#f5f7fa; --sub:rgba(226,233,245,.72); --muted:rgba(226,233,245,.56); --faint:rgba(226,233,245,.46);
  --gold:#e3c48f; --gold-rgb:227,196,143; --ice:#a8dcff; --ice-rgb:168,220,255; --vio:#9b8cff; --vio-rgb:155,140,255;
  --good:#74e0c0; --bad:#ff9d8f; --exp:#b48cff; --exp-rgb:180,140,255; --lab:#6f8fff; --lab-rgb:111,143,255;
  --glass:rgba(13,17,25,.58); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.12);
  --num:"Inter","Noto Sans JP",sans-serif; --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; --disp:"Cinzel","Times New Roman",serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-bottom,0px) + 118px);display:flex;flex-direction:column;gap:14px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.yen{font-size:.62em;margin-right:.06em;font-weight:400;opacity:.85;vertical-align:.08em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.fade{animation:fade .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.calm .fade{animation:none}

/* ---------- ヘッダー ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:26px;height:26px}
.brand b{font:600 16px/1 var(--disp);letter-spacing:.3em;background:linear-gradient(180deg,#fff6e0,var(--gold) 55%,#b48a52);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd-r{display:flex;align-items:center;gap:6px}
.mon{display:flex;align-items:center;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mon button{border:0;background:none;width:40px;height:44px;display:grid;place-items:center;color:var(--sub)}
.mon button:disabled{opacity:.25;cursor:default}
.mon span{font:500 14px var(--num);min-width:86px;text-align:center;letter-spacing:.01em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--sub);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.iconbtn svg,.mon svg{width:18px;height:18px}

/* ---------- サマリー ---------- */
.sum{padding:4px 2px 0}
.sum .lab{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub);font-weight:500}
.sum .lab em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.sales{font:400 clamp(34px,11.6vw,46px)/1.05 var(--num);white-space:nowrap;letter-spacing:-.025em;margin:6px 0 8px;color:#fff;text-shadow:0 0 28px rgba(var(--ice-rgb),.12)}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.chg{display:inline-flex;align-items:center;gap:3px;font:500 14px var(--num);padding:2px 9px 2px 7px;border-radius:999px}
.chg.good{color:var(--good);background:rgba(116,224,192,.09)}
.chg.bad{color:var(--bad);background:rgba(255,157,143,.09)}
.chg.flat{color:var(--sub);background:rgba(255,255,255,.06)}
.chg svg{width:13px;height:13px}
.profitrow{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.profitrow .lab{color:var(--gold)}
.profit{font:400 clamp(24px,7.6vw,30px)/1.1 var(--num);white-space:nowrap;letter-spacing:-.02em;color:var(--gold);margin-top:3px}
.profit.neg{color:var(--bad)}
.rate{text-align:right;font-size:11.5px;color:var(--muted)}
.rate b{display:block;font:500 18px var(--num);color:var(--ink)}
.notice{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:9px 12px;min-height:44px;border-radius:14px;border:1px dashed rgba(var(--gold-rgb),.38);background:rgba(var(--gold-rgb),.05);color:var(--sub);font-size:12.5px;text-align:left}
.notice b{color:var(--gold);font-weight:500}
.notice svg{width:18px;height:18px;flex:none;color:var(--gold)}
.notice .go{margin-left:auto;color:var(--gold);font-weight:500;white-space:nowrap}

/* ---------- カード共通 ---------- */
.card{position:relative;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 28px rgba(0,0,0,.32)}
.card.lit::after{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--ice-rgb),.7),rgba(var(--vio-rgb),.5),transparent);pointer-events:none}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl h2{margin:0;font:500 14px/1.3 var(--body);color:var(--ink)}
.ttl small{font-size:11.5px;color:var(--muted)}

/* ---------- 推移グラフ ---------- */
.trend{padding:14px 14px 10px}
.ctrls{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg button{border:0;background:none;min-width:42px;height:40px;padding:0 10px;border-radius:9px;font:500 12.5px var(--body);color:var(--muted);transition:color .2s,background .2s}
.seg button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.seg.m button[aria-pressed="true"][data-v="sales"]{color:var(--ice);box-shadow:inset 0 0 0 1px rgba(var(--ice-rgb),.35)}
.seg.m button[aria-pressed="true"][data-v="profit"]{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.4)}
.sub2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:30px}
.chips{display:inline-flex;gap:6px}
.chips button{border:1px solid var(--line);background:none;height:36px;padding:0 13px;border-radius:999px;font-size:11.5px;color:var(--muted)}
.chips button[aria-pressed="true"]{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.06)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.miss{background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 2px,transparent 2px 4px);border:1px solid rgba(255,255,255,.2)}
.legend i.zero{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--sub)}
.plot{position:relative;margin-top:6px;touch-action:pan-y}
.plot svg{display:block;width:100%;height:168px;overflow:visible}
.ax{font:400 10px var(--num);fill:var(--muted)}
.tip{position:absolute;top:-4px;min-width:150px;max-width:210px;padding:9px 11px;border-radius:12px;background:rgba(8,11,17,.94);border:1px solid var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.5);
  font-size:11.5px;color:var(--sub);pointer-events:none;transform:translateX(-50%);z-index:3}
.tip b{display:block;font:500 12px var(--body);color:var(--ink);margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip div span:first-child::after{content:""}
.tip div span:last-child{font-family:var(--num);color:var(--ink);font-variant-numeric:tabular-nums}
.tip .hl span:last-child{color:var(--gold)}
.hint{margin-top:2px;font-size:11px;color:var(--faint);text-align:center}

/* ---------- 経営指標 ---------- */
.split{padding:14px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.05);gap:2px}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar-leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bar-leg div{font-size:11.5px;color:var(--muted);min-width:0}
.bar-leg div b{display:block;font:500 14px var(--num);color:var(--ink)}
.bar-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.eq{margin-top:10px;font-size:11px;color:var(--faint)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px 13px 12px;min-height:118px;border-radius:var(--r);border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.045);transition:transform .15s,border-color .2s}
.kpi:active{transform:scale(.98)}
.kpi .top{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12.5px;font-weight:500}
.kpi .top svg{width:18px;height:18px;color:var(--ice);opacity:.9}
.kpi .v{font:400 clamp(17px,5.4vw,21px)/1.2 var(--num);white-space:nowrap;letter-spacing:-.015em;color:#fff;margin-top:4px}
.kpi .c{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .c .chg{font-size:12px;padding:1px 7px 1px 5px}
.kpi .s{font-size:11px;color:var(--faint);margin-top:auto}
.foot{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.7}

/* ---------- 下部ナビ ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(5,7,11,0),rgba(5,7,11,.85) 40%)}
.dock{position:relative;max-width:480px;margin:0 auto;height:66px;border-radius:24px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;
  background:rgba(10,13,19,.86);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.tab{border:0;background:none;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:500 10.5px var(--body);position:relative}
.tab svg{width:23px;height:23px;transition:transform .2s}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--ice);filter:drop-shadow(0 0 5px rgba(var(--ice-rgb),.45))}
.tab.on::after{content:"";position:absolute;bottom:6px;width:16px;height:2px;border-radius:2px;background:var(--ice);box-shadow:0 0 8px rgba(var(--ice-rgb),.8)}
.tab:active svg{transform:scale(.9)}
.addw{border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;gap:3px}
.add{margin-top:-30px;width:58px;height:58px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:conic-gradient(from 200deg,rgba(var(--ice-rgb),.95),rgba(var(--vio-rgb),.85),rgba(var(--gold-rgb),.8),rgba(var(--ice-rgb),.95));box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 6px rgba(5,7,11,.9)}
.add span{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),transparent 45%),radial-gradient(circle at 50% 120%,rgba(var(--ice-rgb),.4),#0b1018 72%);color:#fff}
.add svg{width:24px;height:24px}
.addw:active .add{transform:scale(.94)}
.add-l{font:500 10.5px var(--body);color:var(--sub)}

/* ---------- シート ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;background:#0c1017;border:1px solid var(--line2);border-bottom:0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
body.calm .sheet,body.calm .scrim{transition:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:4px auto 10px}
.sh-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh-hd h3{margin:0;font:500 17px var(--body)}
.sh-hd button{border:0;background:rgba(255,255,255,.06);height:34px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--sub)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.03);min-height:96px}
.pick svg{width:24px;height:24px}
.pick b{font:500 15px var(--body)}
.pick small{font-size:11.5px;color:var(--muted)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:500}
.fld input,.fld select{width:100%;height:50px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:400 16px var(--body);padding:0 14px;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{border-color:rgba(var(--ice-rgb),.6);outline:none}
.money{position:relative}
.money::before{content:"¥";position:absolute;left:15px;top:50%;transform:translateY(-50%);font:400 20px var(--num);color:var(--muted)}
.money input{padding-left:36px;height:60px;font:400 28px var(--num);letter-spacing:-.01em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 84px;gap:10px}
.row3 input{padding:0 10px;min-width:0;font-size:16px}
.row2>*,.row3>*{min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:13px;color:var(--sub)}
.opts button[aria-pressed="true"]{color:#0b0f15;background:var(--ice);border-color:var(--ice);font-weight:500}
.err{font-size:12px;color:var(--bad);margin:-6px 0 12px}
.warn{padding:12px;border-radius:12px;background:rgba(var(--gold-rgb),.07);border:1px solid rgba(var(--gold-rgb),.3);font-size:12.5px;color:var(--sub);margin-bottom:12px}
.warn .opts{margin-top:10px}
.calc{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;color:var(--muted);margin-bottom:14px}
.calc b{font:500 20px var(--num);color:var(--ink)}
.btn{width:100%;height:52px;border-radius:14px;border:0;font:500 16px var(--body);color:#0b0f15;background:linear-gradient(180deg,#d6efff,var(--ice));box-shadow:0 6px 18px rgba(var(--ice-rgb),.2)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.list .it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it span:first-child{font-size:14px}
.list .it small{grid-column:1;font-size:11.5px;color:var(--muted)}
.list .it b{grid-row:1 / span 2;grid-column:2;align-self:center;font:400 15px var(--num)}
.list .tot{border-top:1px solid var(--line2);margin-top:4px}
.list .tot b{color:var(--ice)}
.def{font-size:12.5px;color:var(--sub);line-height:1.8}
.def b{color:var(--ink);font-weight:500}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.sw span{font-size:14px}.sw small{display:block;font-size:11.5px;color:var(--muted)}
.sw input{flex:none;width:50px;height:30px;-webkit-appearance:none;appearance:none;border-radius:999px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#e8edf5;transition:left .2s}
.sw input:checked{background:var(--ice)}.sw input:checked::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.25s;
  display:flex;align-items:center;gap:14px;padding:11px 12px 11px 16px;border-radius:14px;background:rgba(14,19,27,.97);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.55);font-size:13px;width:max-content;max-width:calc(100% - 32px)}
.toast span{flex:1;min-width:0;line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:none;border:0;background:rgba(var(--ice-rgb),.14);color:var(--ice);height:40px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500}
/* PDF */
.pick.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:64px;gap:12px}
.pick.wide span{display:flex;flex-direction:column}
.loading{display:flex;align-items:center;gap:12px;padding:20px 4px;color:var(--sub);font-size:13px}
.loading i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ice);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prows{display:grid;gap:8px;margin-bottom:14px}
.prow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.prow.off{opacity:.45}
.prow .ck input{width:22px;height:22px;accent-color:var(--ice)}
.prow input.pd,.prow .money input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:400 16px var(--num);padding:0 10px;min-width:0}
.prow .money.sm::before{font-size:14px;left:10px}.prow .money.sm input{padding-left:24px;height:44px;font-size:17px}
.prow .pst{grid-column:2 / -1;font-size:11.5px}
.pst.good{color:var(--good)}.pst.warn{color:var(--gold)}.pst.bad{color:var(--bad)}

.cands{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.pnote{font-size:11.5px;color:var(--gold)}
.raw{margin:4px 0 14px;font-size:12px;color:var(--muted)}

/* 時給換算 */
.wage{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);color:inherit}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:10px;margin-top:12px}
.wg div{min-width:0}
.wg span{display:block;font-size:11px;color:var(--muted);line-height:1.35;min-height:2.7em}

.wg b em{font-style:normal;font-size:.62em;color:var(--muted);margin-left:2px}
.wg small{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.wage .more{display:block;margin-top:10px;font-size:11.5px;color:var(--ice)}
.ownbox{padding:14px;border-radius:16px;border:1px solid rgba(var(--gold-rgb),.3);background:rgba(var(--gold-rgb),.05);margin-bottom:16px}
.ownbox span{font-size:12px;color:var(--sub)}
.ownbox b{display:block;font:400 30px var(--num);color:var(--gold);margin:2px 0 4px}
.ownbox b em,.list em.per{font-style:normal;font-size:.55em;color:var(--muted);margin-left:2px}
.hrs{display:flex;align-items:center;gap:8px}
.hrs input{flex:1;text-align:center;font:400 20px var(--num)!important}
.hrs button{flex:none;width:56px;height:50px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:500 14px var(--num)}
.hrs em{font-style:normal;color:var(--muted);font-size:13px}
.h4{margin:16px 0 4px;font:500 13px var(--body);color:var(--sub)}
.upby{display:block;font-style:normal;font-size:10.5px;color:var(--good);text-align:right}
.bonusprev{padding:10px 12px;border-radius:12px;background:rgba(var(--gold-rgb),.06);border:1px solid rgba(var(--gold-rgb),.25);font-size:12px;color:var(--sub);margin-bottom:14px}
.bonusprev b{font:500 14px var(--num);color:var(--gold)}
/* ===== VAULT ロゴ ===== */
.wm{position:relative;display:inline-block;font-family:"Cinzel","Times New Roman","Liberation Serif",serif;font-weight:600;line-height:1;white-space:nowrap;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 12px rgba(216,188,144,.22))}
.wm .ltr{display:inline-block;background:linear-gradient(180deg,#fff6de 0%,#f0d6a2 30%,#c49a5c 48%,#7d5a2c 53%,#b48a50 66%,#f2d9a6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wm .shine{position:absolute;left:0;top:0;pointer-events:none;color:transparent;-webkit-text-fill-color:transparent;
  background:linear-gradient(105deg,transparent 38%,rgba(255,251,240,.95) 50%,transparent 62%) no-repeat;background-size:300% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text}
.em .shn{display:none}

/* ===== 起動演出 ===== */
#intro{--k:1;position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 40%,#0b1426,#05070b 60%,#030406);display:grid;place-items:center;overflow:hidden}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .lg{position:relative;text-align:center;transform:translateY(-6px);transition:transform calc(.8s*var(--k)) cubic-bezier(.5,0,.2,1),opacity calc(.6s*var(--k)),filter calc(.6s*var(--k))}
#intro.out .lg{transform:scale(1.18);opacity:0;filter:blur(8px)}
#intro .em{width:112px;height:112px;margin:0 auto 26px;display:block;overflow:visible;filter:drop-shadow(0 0 24px rgba(216,188,144,.28))}
#intro .em .dr{stroke-dasharray:1;stroke-dashoffset:1}
#intro.s1 .em .dr{animation:draw calc(1s*var(--k)) cubic-bezier(.6,0,.2,1) forwards}
#intro.s1 .em .dr.d2{animation-delay:calc(.25s*var(--k))}
#intro.s1 .em .dr.d3{animation-delay:calc(.55s*var(--k))}
@keyframes draw{to{stroke-dashoffset:0}}
#intro .em .tk{opacity:0}
#intro.s1 .em .tk{animation:tk calc(.3s*var(--k)) ease forwards;animation-delay:calc((.3s + var(--i)*11ms)*var(--k))}
@keyframes tk{to{opacity:var(--o)}}
#intro .em .disc{opacity:0;transform-origin:50px 50px;transform:scale(.6)}
#intro.s1 .em .disc{animation:disc calc(.9s*var(--k)) cubic-bezier(.2,.8,.2,1) calc(.5s*var(--k)) forwards}
@keyframes disc{to{opacity:1;transform:none}}
#intro .em .dial{transform-origin:50px 50px;transform:rotate(-200deg)}
#intro.s2 .em .dial{animation:spin calc(.62s*var(--k)) cubic-bezier(.55,0,.35,1) forwards}
@keyframes spin{0%{transform:rotate(-200deg)}82%{transform:rotate(9deg)}91%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
#intro .em .v{opacity:0;transform-origin:50px 51px;transform:scale(1.35);filter:blur(3px)}
#intro.s3 .em .v{animation:vin calc(.5s*var(--k)) cubic-bezier(.2,.9,.25,1.2) forwards}
@keyframes vin{to{opacity:1;transform:none;filter:none}}
#intro.s3 .em{animation:thud calc(.35s*var(--k)) ease-out}
@keyframes thud{0%{transform:scale(1)}30%{transform:scale(.955)}100%{transform:scale(1)}}
#intro .em .shn{display:block}
#intro .em .shn g{transform:translateX(-80px)}
#intro.s3 .em .shn g{animation:esh calc(1s*var(--k)) ease-in-out calc(.25s*var(--k)) forwards}
@keyframes esh{to{transform:translateX(130px)}}
#intro .wm{font-size:48px;letter-spacing:.3em;margin-right:-.3em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(216,188,144,.35))}
#intro .wm .ltr{opacity:0;transform:translateY(16px);filter:blur(10px)}
#intro.s4 .wm .ltr{animation:ltr calc(.9s*var(--k)) cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.11s*var(--k))}
@keyframes ltr{to{opacity:1;transform:none;filter:none}}
#intro.s6 .wm .shine{animation:wsh calc(1.1s*var(--k)) cubic-bezier(.4,0,.2,1) forwards}
@keyframes wsh{to{background-position:-20% 0}}
#intro .rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
#intro .rule i{display:block;height:1px;width:0;background:linear-gradient(90deg,transparent,#d8bc90);transition:width calc(1.1s*var(--k)) cubic-bezier(.2,.8,.2,1)}
#intro .rule i:last-child{background:linear-gradient(270deg,transparent,#d8bc90)}
#intro.s5 .rule i{width:38px}
#intro .rule small{font-family:"Inter",sans-serif;font-size:9px;letter-spacing:.9em;margin-right:-.9em;color:#cdb388;opacity:0;transition:opacity calc(1s*var(--k)),letter-spacing calc(1.6s*var(--k)) cubic-bezier(.2,.8,.2,1)}
#intro.s5 .rule small{opacity:1;letter-spacing:.42em;margin-right:-.42em}
#intro .skip{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(255,236,206,.25);transition:opacity .4s}
#intro.out .skip{opacity:0}

#intro .rule i{background:linear-gradient(90deg,transparent,#a8dcff)}#intro .rule i:last-child{background:linear-gradient(270deg,transparent,#a8dcff)}
#intro .rule small{color:#bfe3ff}
body.pre .page,body.pre nav{opacity:0}

body.pg nav{z-index:45}

@media (max-width:359px){.brand b{display:none}.tab{font-size:9.5px;letter-spacing:-.03em}.seg button{min-width:36px;padding:0 8px}.ctrls{gap:6px}.page{gap:12px}.csum b{font-size:13px}.pgr{grid-template-columns:repeat(2,1fr)}}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;margin-bottom:12px;border-radius:12px;background:rgba(255,157,143,.08);border:1px solid rgba(255,157,143,.35);font-size:13px}

/* カレンダー */
.csum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.csum div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}

.cal .cw,.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cw span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.cal .cw span:first-child{color:#ff9d8f}.cal .cw span:last-child{color:var(--ice)}
.cd{position:relative;height:54px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cd b{font:500 13px var(--num)}.cd span{font-size:10px;color:var(--ice);letter-spacing:-.02em}
.cd.sun b{color:#ff9d8f}.cd.sat b{color:var(--ice)}
.cd.missing{background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 3px,transparent 3px 7px);border-style:dashed;border-color:rgba(var(--gold-rgb),.45)}

.cd .neg{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.cdet{margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.cdet>b{display:block;font:500 14px var(--body);margin-bottom:6px}
.cdet div{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:3px 0}
.cdet div span:last-child{color:var(--ink)}.cdet .hl span:last-child{color:var(--gold)}
/* 明細 */
.ltot{font-size:12px;color:var(--muted);margin-bottom:8px}.ltot b{color:var(--ink);font:400 13px var(--num)}
.lday{font-size:11.5px;color:var(--ice);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:8px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lrow i{width:7px;height:7px;border-radius:50%;grid-row:1 / span 2}
.lrow.sale i{background:var(--ice)}.lrow.exp i{background:var(--exp)}.lrow.lab i{background:var(--lab)}.lrow.miss i{background:none;border:1px dashed var(--gold)}
.lrow .nm{font-size:13.5px}.lrow .nm em{font-style:normal;font-size:10px;color:var(--ice);border:1px solid rgba(var(--ice-rgb),.4);border-radius:999px;padding:0 6px;margin-left:6px}
.lrow .sb{grid-column:2;font-size:11px;color:var(--muted)}
.lrow b{grid-row:1 / span 2;grid-column:3;font:400 14px var(--num)}
.lrow.sale b{color:var(--ice)}.lrow.miss .nm,.lrow.miss b{color:var(--gold)}
/* 給与 */
.pays{display:grid;gap:10px;margin-bottom:10px}

/* 前月比の説明ボタン */
.info::after{content:"";position:absolute;inset:-8px}

#ob .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
#ob .indg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ob .indg button{height:auto;min-height:64px;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);text-align:left;font-size:14px}
#ob .indg button small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
#ob .indg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(var(--gold-rgb),.1);box-shadow:0 0 0 1px rgba(var(--gold-rgb),.4)}
#ob .wdg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#ob .wdg button{height:44px;padding:0;border-radius:12px;justify-content:center}
body.obon .page,body.obon nav{visibility:hidden}
.cdet .recs{display:block;padding:0}.cdet .recs .rec{display:flex}.cdet .rec span{flex:1}

/* =====================================================================
   COCKPIT テーマ：スレートの地に設計図の方眼、青い光の線だけで見せる
   ===================================================================== */
:root{
  --bg:#0b1630; --char:#1b1f27; --navy:#1a2233;
  --ink:#f2f5fa; --sub:rgba(222,230,242,.74); --muted:rgba(210,220,236,.56); --faint:rgba(210,220,236,.42);
  --gold:#5b9bff; --gold-rgb:91,155,255;          /* 利益・強調（青） */
  --ice:#b3cdff; --ice-rgb:179,205,255;           /* 売上（淡い青） */
  --vio:#7f8cff; --vio-rgb:127,140,255;
  --exp:#a48bff; --exp-rgb:164,139,255; --lab:#3fc7d4; --lab-rgb:63,199,212;
  --blue:#3d7dff; --blue-rgb:61,125,255;
  --glass:rgba(12,22,44,.8); --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --panel:rgba(11,20,40,.84); --grid:rgba(140,170,220,.06);
}
body{background:var(--bg)}

/* ---------- ヘッダー：ロゴを中央に ---------- */
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:62px}
.hd-l{width:44px}
.brand{justify-self:center;flex-direction:column;gap:4px}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(var(--blue-rgb),.18))}
.brand b{display:block;font:600 9.5px/1 var(--disp);letter-spacing:.55em;margin-right:-.55em;background:linear-gradient(180deg,#ffffff,#b8c3d2 55%,#7d899b);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{background:rgba(12,22,44,.8);border-color:var(--line)}

/* ---------- 設計図パネル ---------- */
.bp{position:relative;padding:14px 16px 14px;border-radius:18px;border:1px solid rgba(140,170,220,.12);overflow:hidden;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/18px 18px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/18px 18px,
    linear-gradient(180deg,rgba(16,28,56,.88),rgba(9,17,36,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 30px rgba(0,0,0,.35)}
.bp::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 60% at 70% 30%,rgba(var(--blue-rgb),.08),transparent 70%)}
.bp>*{position:relative}
.ptop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ptop .lab{flex-direction:column;align-items:flex-start;gap:1px}
.ptop .lab em{font-size:11px}
.bp .mon{background:rgba(10,13,18,.45);border-color:rgba(140,170,220,.14);backdrop-filter:none;-webkit-backdrop-filter:none;flex:none}
.bp .mon button{width:34px;height:36px}
.bp .mon span{font:400 13px var(--num);min-width:76px;color:var(--ink)}
.flow{display:block;width:calc(100% + 8px);height:92px;margin:4px -4px 0;overflow:visible}
.sales{font:300 clamp(40px,13vw,54px)/1.02 var(--num);letter-spacing:-.035em;color:#fff;text-shadow:none;margin:2px 0 8px}
.sales .yen{font-weight:300;opacity:.7}
.cmp{font-size:12px}
.info{border-color:rgba(140,170,220,.25)!important;color:var(--sub)!important}

.gauges{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(140,170,220,.1)}
.gg{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:0;border:0;background:none;color:inherit;text-align:left;font:inherit}
.gt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.gt svg{width:16px;height:16px;opacity:.75}
.gb{display:block;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin:7px 0 8px;overflow:hidden}
.gb i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#2557d6,#6aa6ff);box-shadow:0 0 8px rgba(var(--blue-rgb),.7);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.gg.e .gb i{background:linear-gradient(90deg,#6c55d6,var(--exp));box-shadow:0 0 8px rgba(var(--exp-rgb),.5)}
.gg.l .gb i{background:linear-gradient(90deg,#1f8f9c,var(--lab));box-shadow:0 0 8px rgba(var(--lab-rgb),.5)}
.gg .v{font:300 19px/1.15 var(--num);letter-spacing:-.02em;color:#fff;white-space:nowrap;max-width:100%}
.gg.p .v{font-size:24px;color:var(--gold)}
.gg.neg .v{color:var(--bad)}
.gg .gs{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.gg .chg{margin-top:5px;font-size:11px;padding:1px 6px 1px 4px}
.gg .chg svg{width:11px;height:11px}
.gg:active{opacity:.75}
.bp .notice{border-color:rgba(var(--blue-rgb),.4);background:rgba(var(--blue-rgb),.07)}

/* ---------- 場所（事業名と店舗） ---------- */
.loc{display:flex;align-items:center;gap:12px;padding:4px 8px;color:var(--muted)}
.loc svg{width:22px;height:22px;flex:none;color:rgba(200,214,236,.5)}
.loc span{display:flex;flex-direction:column;font-size:12px;line-height:1.45;min-width:0}
.loc b{font-size:14px;font-weight:400;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.storebar button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- カード ---------- */
.card,.kpi{background:var(--panel);border-color:var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:18px}
.card.lit::after{background:linear-gradient(90deg,transparent,rgba(var(--blue-rgb),.8),transparent)}
.seg{background:rgba(8,10,14,.5)}
.seg button[aria-pressed="true"]{background:rgba(var(--blue-rgb),.16);box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.4);color:#fff}
.seg.m button[aria-pressed="true"][data-v="sales"]{color:var(--ice);box-shadow:inset 0 0 0 1px rgba(var(--ice-rgb),.4);background:rgba(var(--ice-rgb),.1)}
.seg.m button[aria-pressed="true"][data-v="profit"]{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.45);background:rgba(var(--gold-rgb),.12)}
.chips button[aria-pressed="true"]{border-color:rgba(var(--blue-rgb),.5);background:rgba(var(--blue-rgb),.12)}
.kpi .top svg{color:#7fb0ff}
.kpi .v{font-weight:300;font-size:clamp(18px,5.8vw,23px)}
.wg b{font-weight:300}
.empty{border-color:rgba(var(--blue-rgb),.4);background:linear-gradient(160deg,rgba(var(--blue-rgb),.1),rgba(255,255,255,.02))}
.empty h2{color:#cfe0ff}
.btn{background:linear-gradient(180deg,#5d9bff,#3570f0);color:#fff;box-shadow:0 6px 18px rgba(var(--blue-rgb),.3)}
.btn.ghost2{background:rgba(255,255,255,.04);color:var(--ink);box-shadow:none}
.opts button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.toast button{background:rgba(var(--blue-rgb),.18);color:#cfe0ff}
.sheet{background:linear-gradient(180deg,#13213f,#0c162d)!important;border-color:rgba(140,170,220,.12)!important}

/* ---------- 下のメニュー：青いパネルを並べたバー ---------- */
nav{background:linear-gradient(180deg,rgba(8,16,34,0),rgba(8,16,34,.9) 45%)}
.dock{border-radius:18px;background:linear-gradient(180deg,rgba(40,56,92,.94),rgba(29,41,70,.96));border:1px solid rgba(140,175,235,.18);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.tab{color:rgba(205,218,240,.6)}
.tab+.tab,.addw+.tab{border-left:1px solid rgba(0,0,0,.25);box-shadow:-1px 0 0 rgba(255,255,255,.04)}
.tab.on{color:#fff}
.tab.on svg{color:#9cc4ff;filter:drop-shadow(0 0 6px rgba(var(--blue-rgb),.8))}
.tab.on::after{background:#7fb0ff;box-shadow:0 0 8px rgba(var(--blue-rgb),.9);bottom:5px}
.add{width:62px;height:62px;margin-top:-32px;background:conic-gradient(from 210deg,#5d9bff 0 68%,rgba(93,155,255,.14) 68% 100%);box-shadow:0 10px 26px rgba(0,0,0,.65),0 0 0 6px #1b2338,0 0 22px rgba(var(--blue-rgb),.35)}
.add span{width:54px;height:54px;background:radial-gradient(circle at 50% 50%,#2b3446 0 46%,#151a24 47% 100%);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.add svg{width:24px;height:24px;color:#fff;filter:drop-shadow(0 0 6px rgba(160,200,255,.9));transition:transform .25s cubic-bezier(.3,.7,.2,1)}
.add-l{color:rgba(205,218,240,.75)}
body.dialon .add svg{transform:rotate(45deg)}

/* ---------- 円形メニュー ---------- */
.dial{position:fixed;inset:0;z-index:60}
.dscrim{position:absolute;inset:0;background:rgba(5,10,24,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .2s}
.dial.on .dscrim{opacity:1}
body.dialon nav{z-index:62;background:none}
body.dialon .dock{background:rgba(29,41,70,.35);border-color:transparent;box-shadow:none}
body.dialon .tab{opacity:.25;pointer-events:none}
.dfan{position:absolute;inset:0;z-index:63;pointer-events:none}
.dsvg{position:absolute;left:0;top:0;opacity:0;transition:opacity .18s}
.dial.on .dsvg{opacity:1}
.wd{fill:rgba(30,50,90,.62);stroke:rgba(150,180,230,.16);stroke-width:1;pointer-events:auto;cursor:pointer;transition:fill .2s,transform .28s cubic-bezier(.3,1.4,.5,1)}
.wd.lit{fill:url(#dwg);stroke:rgba(150,190,255,.5)}
.wedge-edge{fill:rgba(120,170,255,.18);pointer-events:none;transition:transform .28s cubic-bezier(.3,1.4,.5,1),fill .2s}
.wgrp.lit .wedge-edge{fill:#7fb0ff;filter:drop-shadow(0 0 5px rgba(93,155,255,.95))}
.dticks line{stroke:rgba(160,195,255,.35);stroke-width:1}
.dticks line.tb{stroke:rgba(190,215,255,.7);stroke-width:1.4}
.dgear rect{fill:rgba(140,175,235,.32)}
.dring{fill:none;stroke:rgba(8,14,30,.92);stroke-width:14}
.dneedle path{fill:#cfe0ff;filter:drop-shadow(0 0 4px rgba(93,155,255,.9))}
.dneedle .tip{fill:#fff;filter:drop-shadow(0 0 5px rgba(140,190,255,1))}
.darc{fill:#5d9bff;filter:drop-shadow(0 0 6px rgba(93,155,255,.9))}
.dslots{position:absolute;width:0;height:0}
.dslot{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.dk{position:absolute;z-index:1;width:64px;height:64px;margin:0;padding:0;border:0;border-radius:50%;background:none;pointer-events:auto;color:rgba(214,226,244,.55);
  transform:translate(-50%,-50%);transition:color .2s,translate .28s cubic-bezier(.3,1.4,.5,1)}
.dic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;height:100%;font:500 11.5px var(--body)}
.dk svg{width:26px;height:26px}
.dk.lit{color:#fff}
.dk.lit svg{color:#a8c9ff;filter:drop-shadow(0 0 7px rgba(93,155,255,.9))}
.dk:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px}
.dlab{position:absolute;left:0;right:0;z-index:63;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s .08s}
.dial.on .dlab{opacity:1}
.dlab b{display:block;font:300 30px/1.1 var(--body);color:#fff;letter-spacing:.04em}
.dlab span{display:block;margin-top:6px;font-size:14px;color:#6aa6ff}
body.calm .dscrim,body.calm .dsvg,body.calm .dk,body.calm .dlab,body.calm .wd,body.calm .wedge-edge{transition:none}

/* ---------- 起動演出・案内（クロームと青） ---------- */
#intro{background:radial-gradient(120% 80% at 50% 40%,#16305c,#0b1630 60%,#060c1c)}
#intro .em{filter:drop-shadow(0 0 24px rgba(var(--blue-rgb),.3))}
.wm{filter:drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 12px rgba(120,170,255,.2))}
.wm .ltr{background:linear-gradient(180deg,#ffffff 0%,#dfe6ef 30%,#9aa6b6 48%,#4a5466 53%,#a7b3c3 66%,#eef3f8 100%);-webkit-background-clip:text;background-clip:text}
#intro .wm{filter:drop-shadow(0 2px 0 rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(120,170,255,.35))}
#intro .rule i{background:linear-gradient(90deg,transparent,#5d9bff)}
#intro .rule i:last-child{background:linear-gradient(270deg,transparent,#5d9bff)}
#intro .rule small{color:#9cc4ff}
#intro .skip{color:rgba(200,215,240,.3)}
#ob{background:radial-gradient(120% 80% at 50% 0%,#1a3263 0%,#0b1630 60%)}
#ob .obtop .brand{flex-direction:row}
#ob .obtop .brand b{color:#dfe7f2;background:none;-webkit-text-fill-color:currentColor;font-size:15px;letter-spacing:.2em;margin:0}

.loc,.hd{text-shadow:0 1px 3px rgba(0,0,0,.8)}
.foot{color:rgba(200,215,240,.5)}

/* =====================================================================
   GLASS 部品：重なったガラス板・斜めの光沢・下ふちの青い光
   ===================================================================== */
:root{
  --gl:linear-gradient(160deg,rgba(130,165,230,.17),rgba(60,85,140,.10));
  --gl-solid:linear-gradient(160deg,rgba(28,42,74,.94),rgba(15,24,46,.95));
  --gl-sheen:linear-gradient(118deg,rgba(255,255,255,0) 0 56%,rgba(255,255,255,.05) 56.3% 100%);
  --gl-bd:rgba(170,200,255,.30);
  --gl-edge:linear-gradient(135deg,rgba(130,190,255,.75),rgba(120,140,255,.25) 45%,rgba(170,130,255,.6));
  --gl-in:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(120,180,255,.10);
  /* 後ろに2枚重なったガラス板 */
  --stack:5px 6px 0 -1px rgba(12,20,40,.93),5px 6px 0 0 rgba(150,185,245,.22),10px 12px 0 -1px rgba(10,17,35,.92),10px 12px 0 0 rgba(150,185,245,.13),14px 20px 30px rgba(0,0,0,.42);
  --stack1:4px 5px 0 -1px rgba(12,20,40,.93),4px 5px 0 0 rgba(150,185,245,.22),8px 12px 22px rgba(0,0,0,.4);
  --glow-b:0 0 18px rgba(80,150,255,.45);
  --glow-v:0 0 16px rgba(160,120,255,.38);
}

/* ---------- カード・パネル（Card / Modal） ---------- */
.card,.kpi,.bp,.pcard,.sgroup,.cdet,.empty,.csum div,.ownbox,#ob .feat div{
  border:1px solid transparent!important;
  background:var(--gl-sheen) padding-box,var(--gl-solid) padding-box,var(--gl-edge) border-box!important;
  box-shadow:var(--gl-in),var(--stack)!important}
.bp{background:var(--gl-sheen) padding-box,linear-gradient(var(--grid) 1px,transparent 1px) 0 0/18px 18px padding-box,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/18px 18px padding-box,var(--gl-solid) padding-box,var(--gl-edge) border-box!important}
.kpi,.csum div,.sgroup,.cdet,#ob .feat div{box-shadow:var(--gl-in),var(--stack1)!important}
.card.lit::after{display:none}
/* 下ふちの光の線 */
.card::before,.kpi::before,.bp::after,.pcard::before{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(120,185,255,.95),transparent);box-shadow:0 0 10px 1px rgba(80,150,255,.55);border-radius:1px}
.kpi,.pcard{position:relative}
.bp::before{display:none}

/* ---------- 主なボタン（Primary） ---------- */
.btn{position:relative;border-radius:999px;border:1px solid rgba(175,215,255,.75);color:#fff;font-weight:500;letter-spacing:.02em;text-shadow:0 0 8px rgba(160,210,255,.6);
  background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.04) 50%,rgba(255,255,255,0) 52%) padding-box,linear-gradient(180deg,rgba(140,195,255,.72),rgba(70,130,245,.64)) padding-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(20,60,160,.35),0 0 20px rgba(80,150,255,.5),4px 5px 0 -1px rgba(14,24,48,.9),4px 5px 0 0 rgba(150,190,255,.25)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 12px rgba(80,150,255,.45),2px 3px 0 -1px rgba(14,24,48,.9),2px 3px 0 0 rgba(150,190,255,.25)}
.btn:disabled{opacity:.42;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),4px 5px 0 -1px rgba(14,24,48,.9),4px 5px 0 0 rgba(150,190,255,.15)}
/* 2番目のボタン（Secondary：紫のガラス） */
.btn.ghost2{border-color:rgba(175,150,255,.6);color:#d3c6ff;text-shadow:0 0 8px rgba(170,140,255,.5);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 55%) padding-box,linear-gradient(180deg,rgba(120,100,220,.24),rgba(80,60,170,.18)) padding-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--glow-v),4px 5px 0 -1px rgba(14,22,46,.9),4px 5px 0 0 rgba(170,150,255,.22)}
.btn.danger{border-color:rgba(255,160,150,.6);color:#ffd8d2;text-shadow:none;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%) padding-box,rgba(255,110,100,.14) padding-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 14px rgba(255,120,110,.3),4px 5px 0 -1px rgba(14,22,46,.9),4px 5px 0 0 rgba(255,170,160,.2)}

/* ---------- 丸いアイコンボタン（Icon Button） ---------- */
.iconbtn,.info,.pmon button,.bp .mon button{border-radius:50%}
.iconbtn,.info{border:1px solid rgba(170,210,255,.45)!important;color:#bfe0ff!important;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),rgba(255,255,255,0) 45%),radial-gradient(circle at 50% 120%,rgba(80,150,255,.35),rgba(20,35,70,.85) 70%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 14px rgba(80,150,255,.4),3px 4px 0 -1px rgba(12,20,40,.9),3px 4px 0 0 rgba(150,190,255,.2)}
.iconbtn svg{filter:drop-shadow(0 0 4px rgba(140,200,255,.8))}
.add{background:conic-gradient(from 210deg,#7fb6ff 0 68%,rgba(127,182,255,.18) 68% 100%)}
.add span{background:radial-gradient(circle at 35% 22%,rgba(255,255,255,.28),rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 120%,rgba(80,150,255,.5),#101a30 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,0,0,.4)}
.add svg{color:#d6ecff;filter:drop-shadow(0 0 7px rgba(130,195,255,1))}

/* ---------- 入力欄（Text Field / Select） ---------- */
.fld input,.fld select,.ren,.prow input.pd,.prow .money input,#ob .fld input{
  border-radius:14px!important;border:1px solid rgba(170,200,255,.28)!important;color:var(--ink);
  background:var(--gl-sheen),linear-gradient(160deg,rgba(130,165,230,.14),rgba(40,60,110,.22))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(110,175,255,.55),0 7px 14px -10px rgba(80,150,255,.9),4px 5px 0 -1px rgba(12,20,40,.92),4px 5px 0 0 rgba(150,185,245,.2)!important;
  transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.ren:focus,.prow input:focus{outline:none;border-color:rgba(175,150,255,.75)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(130,185,255,.9),0 0 0 3px rgba(150,120,255,.16),0 0 16px rgba(150,120,255,.35),4px 5px 0 -1px rgba(12,20,40,.92),4px 5px 0 0 rgba(170,150,255,.3)!important}
.fld input::placeholder{color:rgba(200,215,240,.38)}
.money::before{z-index:1;color:rgba(190,215,255,.6)}

/* ---------- 選択肢・タブ（Tabs / Segmented） ---------- */
.seg,.opts.wdg{border-radius:14px;border:1px solid rgba(170,200,255,.22);background:var(--gl-sheen),rgba(30,46,80,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--stack1)}
.seg button{position:relative;border-radius:10px}
.seg button[aria-pressed="true"],.seg.m button[aria-pressed="true"][data-v="sales"],.seg.m button[aria-pressed="true"][data-v="profit"]{
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 60%),rgba(80,140,255,.18);box-shadow:inset 0 0 0 1px rgba(160,200,255,.45),0 0 14px rgba(80,150,255,.35)}

/* =====================================================================
   部品の決まり（デザインシステム）
   角の丸み・余白・文字の大きさ・アイコンの大きさを、すべてここで統一する
   ===================================================================== */
:root{
  /* 角の丸み：大＝画面の区切り／中＝中の小さな箱／小＝入力欄／丸＝ボタン類 */
  --r-lg:20px; --r-md:16px; --r-sm:12px; --r-pill:999px;
  /* 余白：4の倍数だけを使う */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  /* 文字：注釈・ラベル・本文・見出し・大見出し */
  --t-xs:11px; --t-sm:12px; --t-md:14px; --t-lg:17px; --t-xl:22px;
  /* アイコン：小＝文字の横／中＝一覧・カード／大＝メニュー */
  --i-sm:16px; --i-md:20px; --i-lg:24px;
}

/* ---------- アイコン ---------- */
.ic{width:var(--i-md);height:var(--i-md);flex:none;display:block}

.gt .ic,.kpi .top .ic,.chg .ic,.cmp .ic{width:var(--i-sm);height:var(--i-sm)}
.chg .ic{width:12px;height:12px}
.iconbtn .ic,.notice .ic,.loc .ic{width:var(--i-md);height:var(--i-md)}
.mon .ic{width:18px;height:18px}
.ic.chev{width:var(--i-sm);height:var(--i-sm);color:var(--muted)}
.kpi .top .ic,.gt .ic{opacity:.85}

/* ---------- 角の丸み ---------- */
.bp,.card,.dock{border-radius:var(--r-lg)!important}
.kpi,.csum div,.cdet,.sgroup,.pcard,.empty,.toast,.notice,.confirm,.pick,.ownbox,.warn,#ob .feat div,#ob .indg button,.prow{border-radius:var(--r-md)!important}
.fld input,.fld select,.ren,.prow input.pd,.prow .money input,.seg,.cd,.ck input{border-radius:var(--r-sm)!important}
.seg button{border-radius:calc(var(--r-sm) - 3px)!important}
.btn,.opts button,.chips button,.storebar button,.tg,.mon,.pmon,.sh-hd button,.confirm button,.toast button{border-radius:var(--r-pill)!important}
.sheet{border-radius:var(--r-lg) var(--r-lg) 0 0!important}

/* ---------- 余白 ---------- */
.page{gap:var(--s3)}
.card,.trend,.split,.wage{padding:var(--s4)!important}
.bp{padding:var(--s4)!important}
.kpis{gap:var(--s3)!important}
.kpi{padding:var(--s3) var(--s3) var(--s3) var(--s4)!important;gap:var(--s1)!important}
.gauges{gap:var(--s3);margin-top:var(--s4);padding-top:var(--s3)}
.ttl{margin-bottom:var(--s3)}
.ctrls,.sub2{gap:var(--s2)}
.sub2{margin-top:var(--s2)}
.fld{margin-bottom:var(--s4)!important}
.fld>span{margin-bottom:var(--s2)!important}
.opts{gap:var(--s2)!important}
.sh-hd{margin-bottom:var(--s4)!important}
.sitem{padding:var(--s3) var(--s4)!important;gap:var(--s3)!important}
.srow{padding:var(--s3) var(--s4)!important}
.sgroup{margin-bottom:var(--s2)}
.h4{margin:var(--s5) 0 var(--s2)!important}
.picks{gap:var(--s3)!important}
.pick{padding:var(--s4)!important;gap:var(--s2)!important}
.loc{padding:var(--s1) var(--s2)!important;gap:var(--s3)!important}

/* ---------- 文字 ---------- */
.ttl h2,.h4{font-size:var(--t-md)!important;font-weight:500!important;letter-spacing:.02em;color:var(--ink)!important}
.h4{color:var(--sub)!important;font-size:var(--t-sm)!important}
.ttl small,.sum .lab em,.kpi .s,.gg .gs,.wg small,.sitem small,.hint,.hint2,.legend,.bar-leg div,.foot,.csum small,.pcard .pgr small,.lrow .sb,.loc span{font-size:var(--t-xs)!important}
.sum .lab,.gt,.kpi .top,.fld>span,.wg span,.cmp,.ltot,.pf,.notice{font-size:var(--t-sm)!important}
.sitem b,.rec,.lrow .nm,.pick b,.sw span,.srow,.cdet div,.tip,.def{font-size:var(--t-md)!important}
.sw span small{font-size:var(--t-xs)!important}
.sh-hd h3{font-size:var(--t-lg)!important;font-weight:500!important}
#ob h2{font-size:var(--t-xl)!important;font-weight:500!important}
.btn{font-size:15px!important}
.opts button,.chips button,.storebar button,.tg,.seg button{font-size:13px!important}
.tab,.add-l{font-size:10.5px!important;letter-spacing:.02em!important}
.dk .dic>span{font-size:var(--t-xs)}
/* 数字：大きいものは細く、小さいものは標準 */
.sales{font-weight:300!important}
.gg .v,.kpi .v,.wg b,.csum b,.pcard .ph span{font-weight:300!important}
.lrow b,.rec b,.cdet .n,.pgr span,.ltot b{font-weight:400!important}

/* ---------- 色の役割（同じ意味には同じ色） ---------- */
.kpi .top .ic,.gt .ic{color:#9cc4ff}
.gg.e .gt .ic{color:var(--exp)}
.gg.l .gt .ic{color:var(--lab)}

.loc .ic{color:rgba(200,214,236,.6)}

body.obon .scrim{z-index:90}body.obon .sheet{z-index:91}body.obon .toast{z-index:95}

</style>

        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#eg)" stroke-width="3.6"/><circle cx="50" cy="50" r="31" fill="url(#ed)" stroke="url(#eg)" stroke-width="2.2"/>

<script>
(() => {
"use strict";
/* =====================================================================
   VAULT 本番版 — データ・計算
   ===================================================================== */
const $ = id => document.getElementById(id);
document.documentElement.lang = "ja";
const APP_VER = "1.2.0";
const KEY = "vault-data-v1", UIKEY = "vault-ui-v1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const dim = (y, m) => new Date(y, m, 0).getDate();
const wd = (y, m, d) => new Date(y, m - 1, d).getDay();
const key = (y, m) => `${y}-${pad2(m)}`;
const isoD = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const WD = "日月火水木金土";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sum = (arr, f) => arr.reduce((a, r) => a + (f ? f(r) : r), 0);
function todayObj(){ const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() }; }
let TODAY = todayObj();
const todayIso = () => isoD(TODAY.y, TODAY.m, TODAY.d);
const isCur = (y, m) => y === TODAY.y && m === TODAY.m;

/* ---------------- 金額の表示 ---------------- */
const fmt = v => Math.round(Math.abs(v)).toLocaleString("ja-JP");
const yen = v => `${v < 0 ? "−" : ""}<span class="yen">¥</span>${fmt(v)}`;
const yenT = v => `${v < 0 ? "−" : ""}¥${fmt(v)}`;
const man = v => v === 0 ? "0" : Math.abs(v) >= 10000 ? (v / 10000).toLocaleString("ja-JP", { maximumFractionDigits: 1 }) + "万" : v.toLocaleString("ja-JP");
const hm = mins => `${Math.floor(mins / 60)}時間${mins % 60 ? mins % 60 + "分" : ""}`;
const hours = mins => Math.round(mins / 6) / 10;

/* ---------------- データの形 ---------------- */
const DEFAULT_CATS = ["仕入れ", "家賃", "水道光熱", "消耗品", "広告", "通信", "交通費", "修繕", "その他"];
const IND = { std: "標準", food: "飲食店", retail: "小売店", service: "サービス業", beauty: "美容・サロン" };
function fresh(){
  return { v: 2, biz: { name: "", industry: "std" }, stores: [], staff: [], cats: DEFAULT_CATS.slice(), costCats: ["仕入れ"], closedWd: [],

$("fRestore").onchange = async e => {

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/";

function findAmounts(s){
  s = Z2H(s).replace(/(20\d{2})\s*[\/\-.年]\s*\d{1,2}\s*[\/\-.月]\s*\d{1,2}\s*日?/g, " ").replace(/\d{1,2}:\d{2}/g, " ").replace(/(?:^|\s)\d{1,2}\s*[\/月]\s*\d{1,2}\s*日?/g, " ");

// 優先順位の高い言葉から順に探す（「現金売上」「カード売上」のような内訳の行は後回し）
const KW = [/総売上/, /売上合計|売上総額|総売上高/, /純売上|税込売上|売上金額|本日売上|売上高/, /^(?!.*(現金|カード|クレジット|電子|QR|商品|部門)).*売上/, /合計|総計/];
function parsePdf(lines){
  const cy = lines.map(l => (Z2H(l).match(/(20\d{2})\s*[\/\-.年]/) || [])[1]).find(Boolean) || cur.y, text = lines.join("\n");
  const hit = D.stores.find(s => s.name && text.includes(s.name)), store = hit ? hit.id : (STORE !== "all" ? STORE : D.stores[0]?.id);

$("fPdf").onchange = async e => {

    else { x.beginPath(); x.arc(px, py, 2 + rnd() * 3, 0, 7); x.stroke(); } }
  // チップ本体
  x.save(); x.shadowColor = "rgba(0,0,0,.7)"; x.shadowBlur = 18; x.fillStyle = "#0a1020"; x.fillRect(cx - h, cy - h, h * 2, h * 2); x.restore();

  x.fillStyle = "rgba(190,215,255,.28)"; for (let q = -h + 4; q < h - 3; q += 3) { x.fillRect(cx + q, cy - h - 3, 1.2, 3); x.fillRect(cx + q, cy + h, 1.2, 3); x.fillRect(cx - h - 3, cy + q, 3, 1.2); x.fillRect(cx + h, cy + q, 3, 1.2); }

  x.fillStyle = "rgba(220,235,255,.26)"; for (let q = -d + 2; q < d - 1; q += 3.2) for (let r = -d + 2; r < d - 1; r += 3.2) x.fillRect(cx + q, cy + r, 1.4, 1.4);

  const vg = x.createRadialGradient(BW / 2, BH / 2, Math.min(BW, BH) * .25, BW / 2, BH / 2, Math.hypot(BW, BH) * .6); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(2,6,16,.65)"); x.fillStyle = vg; x.fillRect(0, 0, BW, BH);

// 配線の上の位置（先頭からの距離 s）
function at(t, s){ for (let i = 0; i < t.seg.length; i++) { if (s <= t.seg[i]) { const [a1, b1] = t.P[i], [a2, b2] = t.P[i + 1], f = s / t.seg[i]; return [a1 + (a2 - a1) * f, b1 + (b2 - b1) * f]; } s -= t.seg[i]; } return t.P[t.P.length - 1]; }

function bgDraw(time, dt){

      bx.strokeStyle = `rgba(60,140,255,${.12 * f * p.a})`; bx.lineWidth = 6; bx.beginPath(); bx.moveTo(...pts[i - 1]); bx.lineTo(...pts[i]); bx.stroke();
      bx.strokeStyle = `rgba(170,215,255,${.7 * f * p.a})`; bx.lineWidth = 1.3; bx.beginPath(); bx.moveTo(...pts[i - 1]); bx.lineTo(...pts[i]); bx.stroke(); }
    if (pts.length) { const [hx, hy] = pts[0], gr = bx.createRadialGradient(hx, hy, 0, hx, hy, 7); gr.addColorStop(0, `rgba(225,240,255,${.7 * p.a})`); gr.addColorStop(1, "rgba(80,150,255,0)"); bx.fillStyle = gr; bx.fillRect(hx - 7, hy - 7, 14, 14); } }

function bgLoop(now){ braf = requestAnimationFrame(bgLoop); if (now - last < 33) return; const dt = last ? Math.min(.08, (now - last) / 1000) : .033; last = now; bgDraw(now / 1000, dt); }
function bgStart(){ cancelAnimationFrame(braf); braf = 0; last = 0;
  if (UI.bgm && !CALM && !document.hidden && !$("sheet").classList.contains("on") && $("dial").hidden) braf = requestAnimationFrame(bgLoop);
  else bgDraw(0, 0); }
function bgPause(){ cancelAnimationFrame(braf); braf = 0; }
document.addEventListener("visibilitychange", bgStart);
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { bgBuild(); bgStart(); }, 200); });

/* =====================================================================
   記録ボタンの円形メニュー（＋を押すと、機械の羽根のように扇形が展開する）
   ===================================================================== */
const DIAL = [
  { f: "sale", t: "売上", s: "その日の売上を入れる", ic: "bars" },
  { f: "exp", t: "経費", s: "仕入れ・家賃・消耗品など", ic: "card" },
  { f: "shift", t: "勤務", s: "時間から人件費を自動計算", ic: "clock" },
  { f: "bonus", t: "歩合", s: "歩合・日当を金額で入れる", ic: "personPlus" },
  { f: "pdf", t: "PDF", s: "レジの日報をまとめて読み込む", ic: "doc" }
];
let dialFocus = 0, DG = null, needleA = 0, dialAnims = [];
const RAD = a => a * Math.PI / 180;
function dialGeom(){
  const k = $("bAdd").querySelector(".add").getBoundingClientRect(), cx = k.left + k.width / 2, cy = k.top + k.height / 2;
  const R = Math.min(150, innerWidth / 2 - 20), r = 40, a0 = 196, a1 = 344;
  return { cx, cy, R, r, a0, a1, step: (a1 - a0) / DIAL.length, mid: i => a0 + (a1 - a0) / DIAL.length * (i + .5) };
}
// 扇形（中心0,0基準）
function arcPath(r1, r2, s, e){

  return `M${a[0].toFixed(2)} ${a[1].toFixed(2)}A${r2} ${r2} 0 0 1 ${b[0].toFixed(2)} ${b[1].toFixed(2)}L${c[0].toFixed(2)} ${c[1].toFixed(2)}A${r1} ${r1} 0 0 0 ${d[0].toFixed(2)} ${d[1].toFixed(2)}Z`;
}
function openDial(){
  const G = DG = dialGeom(), box = $("dial"), fan = $("dFan"), W = innerWidth, H = innerHeight;
  // 目盛りの輪（外側）
  let ticks = ""; for (let a = G.a0 - 8; a <= G.a1 + 8; a += 4) { const big = Math.round(a - G.a0) % 20 === 0, r1 = G.R + 7, r2 = G.R + (big ? 15 : 11);
    ticks += `<line x1="${(r1 * Math.cos(RAD(a))).toFixed(1)}" y1="${(r1 * Math.sin(RAD(a))).toFixed(1)}" x2="${(r2 * Math.cos(RAD(a))).toFixed(1)}" y2="${(r2 * Math.sin(RAD(a))).toFixed(1)}" class="${big ? "tb" : ""}"/>`; }
  // 歯車の歯（つまみの周り）
  let gear = ""; for (let a = 0; a < 360; a += 12) gear += `<rect x="${G.r + 13}" y="-1.6" width="5" height="3.2" rx=".8" transform="rotate(${a})"/>`;
  let wedges = "", slots = "";
  DIAL.forEach((it, i) => { const s = G.a0 + G.step * i + 1.4, e = G.a0 + G.step * (i + 1) - 1.4, m = G.mid(i), rm = G.r + (G.R - G.r) * .6;
    wedges += `<g class="wgrp" data-i="${i}"><path class="wd" data-i="${i}" d="${arcPath(G.r + 22, G.R, s, e)}"/><path class="wedge-edge" d="${arcPath(G.R - 3, G.R, s, e)}"/></g>`;
    slots += `<div class="dslot" data-i="${i}"><button type="button" class="dk" data-i="${i}" data-f="${it.f}" style="left:${(rm * Math.cos(RAD(m))).toFixed(1)}px;top:${(rm * Math.sin(RAD(m))).toFixed(1)}px" aria-label="${it.t}を記録（${it.s}）"><span class="dic">${ICON(it.ic)}<span>${it.t}</span></span></button></div>`; });
  fan.innerHTML = `<svg class="dsvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <defs><radialGradient id="dwg" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="${G.R}"><stop offset=".3" stop-color="#3d7dff" stop-opacity=".06"/><stop offset="1" stop-color="#3d7dff" stop-opacity=".6"/></radialGradient></defs>
    <g transform="translate(${G.cx} ${G.cy})">

      <path class="darc" id="dArc" d="${arcPath(G.r + 6, G.r + 10, -60, 60)}"/>

  box.hidden = false; document.body.classList.add("dialon"); bgPause();
  requestAnimationFrame(() => box.classList.add("on"));

  fan.querySelectorAll(".wd").forEach(p => { p.onclick = () => pickDial(+p.dataset.i); p.onpointerenter = () => litDial(+p.dataset.i); });
  needleA = G.a0 - 20; setNeedle(needleA, false);
  if (!CALM) {
    const ease = "cubic-bezier(.25,1.35,.45,1)";
    dialAnims = [];
    // 羽根：左端にたたまれた状態から、順番に回転して所定の位置で止まる
    DIAL.forEach((_, i) => { const from = -(G.mid(i) - G.a0 + 14), d = 70 * i;
      dialAnims.push($("dWedges").children[i].animate([{ transform: `rotate(${from}deg)`, opacity: 0 }, { opacity: 1, offset: .25 }, { transform: "rotate(0deg)", opacity: 1 }], { duration: 520, delay: d, easing: ease, fill: "backwards" }));
      const slot = fan.querySelector(`.dslot[data-i="${i}"]`), ic = slot.querySelector(".dic");
      dialAnims.push(slot.animate([{ transform: `rotate(${from}deg)`, opacity: 0 }, { opacity: 1, offset: .3 }, { transform: "rotate(0deg)", opacity: 1 }], { duration: 520, delay: d, easing: ease, fill: "backwards" }));

// 指針（針）を回す：行き過ぎてから戻る、機械らしい止まり方

    n.animate(kf, { duration: 380, easing: "cubic-bezier(.3,.8,.3,1)" }); arc.animate(kf, { duration: 460, easing: "cubic-bezier(.3,.8,.3,1)" });

function litDial(i){

  $("dFan").querySelectorAll("[data-i]").forEach(el => el.classList.toggle("lit", +el.dataset.i === i));
  // 選ばれた羽根を少し外へ押し出す
  $("dFan").querySelectorAll(".wgrp").forEach(g => { const k = +g.dataset.i, m = DG.mid(k), on = k === i; g.querySelector(".wd").style.transform = on ? `translate(${(Math.cos(RAD(m)) * 7).toFixed(1)}px,${(Math.sin(RAD(m)) * 7).toFixed(1)}px)` : ""; g.querySelector(".wedge-edge").style.transform = g.querySelector(".wd").style.transform; });
  $("dFan").querySelectorAll(".dk").forEach(b => { const k = +b.dataset.i, m = DG.mid(k); b.style.translate = k === i ? `${(Math.cos(RAD(m)) * 7).toFixed(1)}px ${(Math.sin(RAD(m)) * 7).toFixed(1)}px` : ""; });
  if (changed) { setNeedle(DG.mid(i), true); const lab = $("dial").querySelector(".dlab"); if (!CALM) lab.animate([{ transform: "translateY(6px)", opacity: .2 }, { transform: "none", opacity: 1 }], { duration: 220, easing: "ease-out" }); }
  $("dT").textContent = DIAL[i].t; $("dS").textContent = DIAL[i].s;
}
function closeDial(then){
  const box = $("dial"); if (box.hidden) { then && then(); return; }
  box.classList.remove("on"); document.body.classList.remove("dialon");
  if (!CALM && DG) { DIAL.forEach((_, i) => { const to = -(DG.mid(i) - DG.a0 + 14), g = $("dWedges")?.children[i], s = $("dFan").querySelector(`.dslot[data-i="${i}"]`);
      const o = { duration: 200, delay: (DIAL.length - 1 - i) * 25, easing: "cubic-bezier(.5,0,.8,.4)", fill: "forwards" };
      g && g.animate([{ transform: "rotate(0)", opacity: 1 }, { transform: `rotate(${to}deg)`, opacity: 0 }], o); s && s.animate([{ transform: "rotate(0)", opacity: 1 }, { transform: `rotate(${to}deg)`, opacity: 0 }], o); }); }
  setTimeout(() => { box.hidden = true; $("dFan").innerHTML = ""; DG = null; if (!then) { bgStart(); $("bAdd").focus({ preventScroll: true }); } }, CALM ? 0 : 260);

}
function pickDial(i){
  const f = DIAL[i].f; litDial(i);

  if (CALM) return go();
  // 押した羽根がカチッと沈んでから開く

$("dScrim").onclick = () => closeDial();
$("dial").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); closeDial(); }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const n = (dialFocus + (e.key === "ArrowRight" ? 1 : -1) + DIAL.length) % DIAL.length; $("dFan").querySelector(`.dk[data-i="${n}"]`).focus(); }
  if (e.key === "Tab") { const f = [...$("dFan").querySelectorAll(".dk")]; if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); } }
});
addEventListener("resize", () => { if (!$("dial").hidden) closeDial(); });

/* =====================================================================
   起動・操作の割り当て
   ===================================================================== */
const plot = $("plot");
plot.addEventListener("pointerdown", e => { if (!geom) return; pickAt(e.clientX); try { plot.setPointerCapture(e.pointerId); } catch (er) {} });
plot.addEventListener("pointermove", e => { if (e.buttons && geom) pickAt(e.clientX); });
plot.addEventListener("keydown", e => { if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || !S.length) return; e.preventDefault(); const lastI = S.map(s => !s.fut).lastIndexOf(true); sel = sel === null ? lastI : Math.max(0, Math.min(lastI, sel + (e.key === "ArrowRight" ? 1 : -1))); renderChart(false); });
document.addEventListener("pointerdown", e => { if (!e.composedPath().includes(plot) && sel !== null) { sel = null; renderChart(false); } });
const setGroup = (q, fn) => document.querySelectorAll(q).forEach(b => b.onclick = () => { document.querySelectorAll(q).forEach(x => x.setAttribute("aria-pressed", String(x === b))); fn(b); sel = null; renderChart(true); });
setGroup(".seg.m button", b => metric = b.dataset.v); setGroup("#segP button", b => per = b.dataset.p); setGroup("#chips button", b => cmode = b.dataset.c);

const moveMonth = dir => { let { y, m } = cur; m += dir; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } if (key(y, m) > key(TODAY.y, TODAY.m) || key(y, m) < firstKey()) return; cur = { y, m }; sel = null; renderAll(true); };
$("mPrev").onclick = () => moveMonth(-1); $("mNext").onclick = () => moveMonth(1);
$("bAdd").onclick = () => { if (!$("dial").hidden) return closeDial(); if (!D.stores.length) return openOnboarding(); if ($("sheet").classList.contains("on")) askClose(() => { closeSheet(); openDial(); }); else openDial(); };
$("bSet").onclick = openSettings;
$("wage").onclick = () => openWage();
$("bInfo").onclick = openCmpInfo;
$("eAdd").onclick = () => openForm("sale", { y: TODAY.y, m: TODAY.m, d: TODAY.d });
$("ePdf").onclick = () => $("fPdf").click();
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { const i = +t.dataset.t; if (i === 0) { if ($("sheet").classList.contains("on")) askClose(closeSheet); scrollTo({ top: 0, behavior: CALM ? "auto" : "smooth" }); } else askClose(() => openPage(i)); });
// 売上の部分を左右にスワイプして月を切り替える
(() => { let sx = null, sy = null; const el = document.querySelector(".sum");
  el.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  el.addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1); });
  el.addEventListener("pointercancel", () => sx = null); })();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { renderChart(false); renderFlow(false); fitText(); }, 120); });
// 日付が変わったまま開きっぱなしでも、戻ってきたら今日に合わせる
document.addEventListener("visibilitychange", () => { if (!document.hidden) { const t = todayObj(); if (t.d !== TODAY.d || t.m !== TODAY.m || t.y !== TODAY.y) { renderAll(false); refreshPage(); } } });
// ほかのタブ・ウインドウで変更されたら読み直す
addEventListener("storage", e => { if (e.key === KEY) { D = load(); reindex(); fixStore(); renderAll(false); refreshPage(); } });

// iPhoneにデータを消されにくくする（ホーム画面に追加したときに有効）
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
// 電波がなくても開けるようにする

bgBuild(); bgStart();
renderAll(true);
if (UI.intro !== "off" && !CALM) { document.body.classList.add("pre"); playIntro(); }
else if (!D.meta.setup) openOnboarding();

window.__vaultTest = { get D(){ return D; }, monthTot, dayInfo, compare: () => compare(), curTot: () => curTot(), setCur: (y, m) => { cur = { y, m }; renderAll(false); }, series: (p, mt) => { per = p; metric = mt; return series(); }, shiftCalc };

})();
