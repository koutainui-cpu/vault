<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VAULT</title>
<meta name="description" content="売上・経費・人件費をまとめて記録し、利益がひと目で分かる経営アプリ">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAULT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>

/* 構成：精密な背景（同心円・回路・粒子）の上に、情報だけが浮かぶ3層。上＝サマリー、中＝推移、下＝経営指標。下部に固定ナビと中央の追加ボタン */
:root{
  --bg:#05070b; --char:#0d1117; --navy:#0a1324;
  --ink:#f5f7fa; --sub:rgba(226,233,245,.72); --muted:rgba(226,233,245,.56); --faint:rgba(226,233,245,.46);
  --gold:#e3c48f; --gold-rgb:227,196,143; --ice:#a8dcff; --ice-rgb:168,220,255; --vio:#9b8cff; --vio-rgb:155,140,255;
  --good:#74e0c0; --bad:#ff9d8f; --exp:#b48cff; --exp-rgb:180,140,255; --lab:#6f8fff; --lab-rgb:111,143,255;
  --glass:rgba(13,17,25,.58); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.12);
  --num:"Inter","Noto Sans JP",sans-serif; --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; --disp:"Cinzel","Times New Roman",serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-bottom,0px) + 118px);display:flex;flex-direction:column;gap:14px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.yen{font-size:.62em;margin-right:.06em;font-weight:400;opacity:.85;vertical-align:.08em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.fade{animation:fade .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.calm .fade{animation:none}

/* ---------- ヘッダー ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:26px;height:26px}
.brand b{font:600 16px/1 var(--disp);letter-spacing:.3em;background:linear-gradient(180deg,#fff6e0,var(--gold) 55%,#b48a52);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd-r{display:flex;align-items:center;gap:6px}
.mon{display:flex;align-items:center;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mon button{border:0;background:none;width:40px;height:44px;display:grid;place-items:center;color:var(--sub)}
.mon button:disabled{opacity:.25;cursor:default}
.mon span{font:500 14px var(--num);min-width:86px;text-align:center;letter-spacing:.01em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--sub);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.iconbtn svg,.mon svg{width:18px;height:18px}

/* ---------- サマリー ---------- */
.sum{padding:4px 2px 0}
.sum .lab{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub);font-weight:500}
.sum .lab em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.sales{font:400 clamp(34px,11.6vw,46px)/1.05 var(--num);white-space:nowrap;letter-spacing:-.025em;margin:6px 0 8px;color:#fff;text-shadow:0 0 28px rgba(var(--ice-rgb),.12)}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.chg{display:inline-flex;align-items:center;gap:3px;font:500 14px var(--num);padding:2px 9px 2px 7px;border-radius:999px}
.chg.good{color:var(--good);background:rgba(116,224,192,.09)}
.chg.bad{color:var(--bad);background:rgba(255,157,143,.09)}
.chg.flat{color:var(--sub);background:rgba(255,255,255,.06)}
.chg svg{width:13px;height:13px}
.profitrow{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.profitrow .lab{color:var(--gold)}
.profit{font:400 clamp(24px,7.6vw,30px)/1.1 var(--num);white-space:nowrap;letter-spacing:-.02em;color:var(--gold);margin-top:3px}
.profit.neg{color:var(--bad)}
.rate{text-align:right;font-size:11.5px;color:var(--muted)}
.rate b{display:block;font:500 18px var(--num);color:var(--ink)}
.notice{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:9px 12px;min-height:44px;border-radius:14px;border:1px dashed rgba(var(--gold-rgb),.38);background:rgba(var(--gold-rgb),.05);color:var(--sub);font-size:12.5px;text-align:left}
.notice b{color:var(--gold);font-weight:500}
.notice svg{width:18px;height:18px;flex:none;color:var(--gold)}
.notice .go{margin-left:auto;color:var(--gold);font-weight:500;white-space:nowrap}

/* ---------- カード共通 ---------- */
.card{position:relative;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 28px rgba(0,0,0,.32)}
.card.lit::after{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--ice-rgb),.7),rgba(var(--vio-rgb),.5),transparent);pointer-events:none}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl h2{margin:0;font:500 14px/1.3 var(--body);color:var(--ink)}
.ttl small{font-size:11.5px;color:var(--muted)}

/* ---------- 推移グラフ ---------- */
.trend{padding:14px 14px 10px}
.ctrls{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg button{border:0;background:none;min-width:42px;height:40px;padding:0 10px;border-radius:9px;font:500 12.5px var(--body);color:var(--muted);transition:color .2s,background .2s}
.seg button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.seg.m button[aria-pressed="true"][data-v="sales"]{color:var(--ice);box-shadow:inset 0 0 0 1px rgba(var(--ice-rgb),.35)}
.seg.m button[aria-pressed="true"][data-v="profit"]{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.4)}
.sub2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:30px}
.chips{display:inline-flex;gap:6px}
.chips button{border:1px solid var(--line);background:none;height:36px;padding:0 13px;border-radius:999px;font-size:11.5px;color:var(--muted)}
.chips button[aria-pressed="true"]{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.06)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.miss{background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 2px,transparent 2px 4px);border:1px solid rgba(255,255,255,.2)}
.legend i.zero{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--sub)}
.plot{position:relative;margin-top:6px;touch-action:pan-y}
.plot svg{display:block;width:100%;height:168px;overflow:visible}
.ax{font:400 10px var(--num);fill:var(--muted)}
.tip{position:absolute;top:-4px;min-width:150px;max-width:210px;padding:9px 11px;border-radius:12px;background:rgba(8,11,17,.94);border:1px solid var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.5);
  font-size:11.5px;color:var(--sub);pointer-events:none;transform:translateX(-50%);z-index:3}
.tip b{display:block;font:500 12px var(--body);color:var(--ink);margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip div span:first-child::after{content:""}
.tip div span:last-child{font-family:var(--num);color:var(--ink);font-variant-numeric:tabular-nums}
.tip .hl span:last-child{color:var(--gold)}
.hint{margin-top:2px;font-size:11px;color:var(--faint);text-align:center}

/* ---------- 経営指標 ---------- */
.split{padding:14px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.05);gap:2px}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar-leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bar-leg div{font-size:11.5px;color:var(--muted);min-width:0}
.bar-leg div b{display:block;font:500 14px var(--num);color:var(--ink)}
.bar-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.eq{margin-top:10px;font-size:11px;color:var(--faint)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px 13px 12px;min-height:118px;border-radius:var(--r);border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.045);transition:transform .15s,border-color .2s}
.kpi:active{transform:scale(.98)}
.kpi .top{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12.5px;font-weight:500}
.kpi .top svg{width:18px;height:18px;color:var(--ice);opacity:.9}
.kpi .v{font:400 clamp(17px,5.4vw,21px)/1.2 var(--num);white-space:nowrap;letter-spacing:-.015em;color:#fff;margin-top:4px}
.kpi .c{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .c .chg{font-size:12px;padding:1px 7px 1px 5px}
.kpi .s{font-size:11px;color:var(--faint);margin-top:auto}
.foot{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.7}

/* ---------- 下部ナビ ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(5,7,11,0),rgba(5,7,11,.85) 40%)}
.dock{position:relative;max-width:480px;margin:0 auto;height:66px;border-radius:24px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;
  background:rgba(10,13,19,.86);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.tab{border:0;background:none;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:500 10.5px var(--body);position:relative}
.tab svg{width:23px;height:23px;transition:transform .2s}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--ice);filter:drop-shadow(0 0 5px rgba(var(--ice-rgb),.45))}
.tab.on::after{content:"";position:absolute;bottom:6px;width:16px;height:2px;border-radius:2px;background:var(--ice);box-shadow:0 0 8px rgba(var(--ice-rgb),.8)}
.tab:active svg{transform:scale(.9)}
.addw{border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;gap:3px}
.add{margin-top:-30px;width:58px;height:58px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:conic-gradient(from 200deg,rgba(var(--ice-rgb),.95),rgba(var(--vio-rgb),.85),rgba(var(--gold-rgb),.8),rgba(var(--ice-rgb),.95));box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 6px rgba(5,7,11,.9)}
.add span{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),transparent 45%),radial-gradient(circle at 50% 120%,rgba(var(--ice-rgb),.4),#0b1018 72%);color:#fff}
.add svg{width:24px;height:24px}
.addw:active .add{transform:scale(.94)}
.add-l{font:500 10.5px var(--body);color:var(--sub)}

/* ---------- シート ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;background:#0c1017;border:1px solid var(--line2);border-bottom:0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
body.calm .sheet,body.calm .scrim{transition:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:4px auto 10px}
.sh-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh-hd h3{margin:0;font:500 17px var(--body)}
.sh-hd button{border:0;background:rgba(255,255,255,.06);height:34px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--sub)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.03);min-height:96px}
.pick svg{width:24px;height:24px}
.pick b{font:500 15px var(--body)}
.pick small{font-size:11.5px;color:var(--muted)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:500}
.fld input,.fld select{width:100%;height:50px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:400 16px var(--body);padding:0 14px;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{border-color:rgba(var(--ice-rgb),.6);outline:none}
.money{position:relative}
.money::before{content:"¥";position:absolute;left:15px;top:50%;transform:translateY(-50%);font:400 20px var(--num);color:var(--muted)}
.money input{padding-left:36px;height:60px;font:400 28px var(--num);letter-spacing:-.01em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 84px;gap:10px}
.row3 input{padding:0 10px;min-width:0;font-size:16px}
.row2>*,.row3>*{min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:13px;color:var(--sub)}
.opts button[aria-pressed="true"]{color:#0b0f15;background:var(--ice);border-color:var(--ice);font-weight:500}
.err{font-size:12px;color:var(--bad);margin:-6px 0 12px}
.warn{padding:12px;border-radius:12px;background:rgba(var(--gold-rgb),.07);border:1px solid rgba(var(--gold-rgb),.3);font-size:12.5px;color:var(--sub);margin-bottom:12px}
.warn .opts{margin-top:10px}
.calc{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;color:var(--muted);margin-bottom:14px}
.calc b{font:500 20px var(--num);color:var(--ink)}
.btn{width:100%;height:52px;border-radius:14px;border:0;font:500 16px var(--body);color:#0b0f15;background:linear-gradient(180deg,#d6efff,var(--ice));box-shadow:0 6px 18px rgba(var(--ice-rgb),.2)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.list .it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it span:first-child{font-size:14px}
.list .it small{grid-column:1;font-size:11.5px;color:var(--muted)}
.list .it b{grid-row:1 / span 2;grid-column:2;align-self:center;font:400 15px var(--num)}
.list .tot{border-top:1px solid var(--line2);margin-top:4px}
.list .tot b{color:var(--ice)}
.def{font-size:12.5px;color:var(--sub);line-height:1.8}
.def b{color:var(--ink);font-weight:500}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.sw span{font-size:14px}.sw small{display:block;font-size:11.5px;color:var(--muted)}
.sw input{flex:none;width:50px;height:30px;-webkit-appearance:none;appearance:none;border-radius:999px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#e8edf5;transition:left .2s}
.sw input:checked{background:var(--ice)}.sw input:checked::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.25s;
  display:flex;align-items:center;gap:14px;padding:11px 12px 11px 16px;border-radius:14px;background:rgba(14,19,27,.97);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.55);font-size:13px;width:max-content;max-width:calc(100% - 32px)}
.toast span{flex:1;min-width:0;line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:none;border:0;background:rgba(var(--ice-rgb),.14);color:var(--ice);height:40px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500}
/* PDF */
.pick.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:64px;gap:12px}
.pick.wide span{display:flex;flex-direction:column}
.loading{display:flex;align-items:center;gap:12px;padding:20px 4px;color:var(--sub);font-size:13px}
.loading i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ice);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prows{display:grid;gap:8px;margin-bottom:14px}
.prow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.prow.off{opacity:.45}
.prow .ck input{width:22px;height:22px;accent-color:var(--ice)}
.prow input.pd,.prow .money input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:400 16px var(--num);padding:0 10px;min-width:0}
.prow .money.sm::before{font-size:14px;left:10px}.prow .money.sm input{padding-left:24px;height:44px;font-size:17px}
.prow .pst{grid-column:2 / -1;font-size:11.5px}
.pst.good{color:var(--good)}.pst.warn{color:var(--gold)}.pst.bad{color:var(--bad)}

.cands{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.pnote{font-size:11.5px;color:var(--gold)}
.raw{margin:4px 0 14px;font-size:12px;color:var(--muted)}

/* 時給換算 */
.wage{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);color:inherit}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:10px;margin-top:12px}
.wg div{min-width:0}
.wg span{display:block;font-size:11px;color:var(--muted);line-height:1.35;min-height:2.7em}

.wg b em{font-style:normal;font-size:.62em;color:var(--muted);margin-left:2px}
.wg small{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.wage .more{display:block;margin-top:10px;font-size:11.5px;color:var(--ice)}
.ownbox{padding:14px;border-radius:16px;border:1px solid rgba(var(--gold-rgb),.3);background:rgba(var(--gold-rgb),.05);margin-bottom:16px}
.ownbox span{font-size:12px;color:var(--sub)}
.ownbox b{display:block;font:400 30px var(--num);color:var(--gold);margin:2px 0 4px}
.ownbox b em,.list em.per{font-style:normal;font-size:.55em;color:var(--muted);margin-left:2px}
.hrs{display:flex;align-items:center;gap:8px}
.hrs input{flex:1;text-align:center;font:400 20px var(--num)!important}
.hrs button{flex:none;width:56px;height:50px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:500 14px var(--num)}
.hrs em{font-style:normal;color:var(--muted);font-size:13px}
.h4{margin:16px 0 4px;font:500 13px var(--body);color:var(--sub)}
.upby{display:block;font-style:normal;font-size:10.5px;color:var(--good);text-align:right}
.bonusprev{padding:10px 12px;border-radius:12px;background:rgba(var(--gold-rgb),.06);border:1px solid rgba(var(--gold-rgb),.25);font-size:12px;color:var(--sub);margin-bottom:14px}
.bonusprev b{font:500 14px var(--num);color:var(--gold)}
/* ===== VAULT ロゴ ===== */
.wm{position:relative;display:inline-block;font-family:"Cinzel","Times New Roman","Liberation Serif",serif;font-weight:600;line-height:1;white-space:nowrap;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 0 12px rgba(216,188,144,.22))}
.wm .ltr{display:inline-block;background:linear-gradient(180deg,#fff6de 0%,#f0d6a2 30%,#c49a5c 48%,#7d5a2c 53%,#b48a50 66%,#f2d9a6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wm .shine{position:absolute;left:0;top:0;pointer-events:none;color:transparent;-webkit-text-fill-color:transparent;
  background:linear-gradient(105deg,transparent 38%,rgba(255,251,240,.95) 50%,transparent 62%) no-repeat;background-size:300% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text}
.em .shn{display:none}

/* ===== 起動演出 ===== */
#intro{--k:1;position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 40%,#0b1426,#05070b 60%,#030406);display:grid;place-items:center;overflow:hidden}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .lg{position:relative;text-align:center;transform:translateY(-6px);transition:transform calc(.8s*var(--k)) cubic-bezier(.5,0,.2,1),opacity calc(.6s*var(--k)),filter calc(.6s*var(--k))}
#intro.out .lg{transform:scale(1.18);opacity:0;filter:blur(8px)}
#intro .em{width:112px;height:112px;margin:0 auto 26px;display:block;overflow:visible;filter:drop-shadow(0 0 24px rgba(216,188,144,.28))}
#intro .em .dr{stroke-dasharray:1;stroke-dashoffset:1}
#intro.s1 .em .dr{animation:draw calc(1s*var(--k)) cubic-bezier(.6,0,.2,1) forwards}
#intro.s1 .em .dr.d2{animation-delay:calc(.25s*var(--k))}
#intro.s1 .em .dr.d3{animation-delay:calc(.55s*var(--k))}
@keyframes draw{to{stroke-dashoffset:0}}
#intro .em .tk{opacity:0}
#intro.s1 .em .tk{animation:tk calc(.3s*var(--k)) ease forwards;animation-delay:calc((.3s + var(--i)*11ms)*var(--k))}
@keyframes tk{to{opacity:var(--o)}}
#intro .em .disc{opacity:0;transform-origin:50px 50px;transform:scale(.6)}
#intro.s1 .em .disc{animation:disc calc(.9s*var(--k)) cubic-bezier(.2,.8,.2,1) calc(.5s*var(--k)) forwards}
@keyframes disc{to{opacity:1;transform:none}}
#intro .em .dial{transform-origin:50px 50px;transform:rotate(-200deg)}
#intro.s2 .em .dial{animation:spin calc(.62s*var(--k)) cubic-bezier(.55,0,.35,1) forwards}
@keyframes spin{0%{transform:rotate(-200deg)}82%{transform:rotate(9deg)}91%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
#intro .em .v{opacity:0;transform-origin:50px 51px;transform:scale(1.35);filter:blur(3px)}
#intro.s3 .em .v{animation:vin calc(.5s*var(--k)) cubic-bezier(.2,.9,.25,1.2) forwards}
@keyframes vin{to{opacity:1;transform:none;filter:none}}
#intro.s3 .em{animation:thud calc(.35s*var(--k)) ease-out}
@keyframes thud{0%{transform:scale(1)}30%{transform:scale(.955)}100%{transform:scale(1)}}
#intro .em .shn{display:block}
#intro .em .shn g{transform:translateX(-80px)}
#intro.s3 .em .shn g{animation:esh calc(1s*var(--k)) ease-in-out calc(.25s*var(--k)) forwards}
@keyframes esh{to{transform:translateX(130px)}}
#intro .wm{font-size:48px;letter-spacing:.3em;margin-right:-.3em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(216,188,144,.35))}
#intro .wm .ltr{opacity:0;transform:translateY(16px);filter:blur(10px)}
#intro.s4 .wm .ltr{animation:ltr calc(.9s*var(--k)) cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.11s*var(--k))}
@keyframes ltr{to{opacity:1;transform:none;filter:none}}
#intro.s6 .wm .shine{animation:wsh calc(1.1s*var(--k)) cubic-bezier(.4,0,.2,1) forwards}
@keyframes wsh{to{background-position:-20% 0}}
#intro .rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
#intro .rule i{display:block;height:1px;width:0;background:linear-gradient(90deg,transparent,#d8bc90);transition:width calc(1.1s*var(--k)) cubic-bezier(.2,.8,.2,1)}
#intro .rule i:last-child{background:linear-gradient(270deg,transparent,#d8bc90)}
#intro.s5 .rule i{width:38px}
#intro .rule small{font-family:"Inter",sans-serif;font-size:9px;letter-spacing:.9em;margin-right:-.9em;color:#cdb388;opacity:0;transition:opacity calc(1s*var(--k)),letter-spacing calc(1.6s*var(--k)) cubic-bezier(.2,.8,.2,1)}
#intro.s5 .rule small{opacity:1;letter-spacing:.42em;margin-right:-.42em}
#intro .skip{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(255,236,206,.25);transition:opacity .4s}
#intro.out .skip{opacity:0}

#intro .rule i{background:linear-gradient(90deg,transparent,#a8dcff)}#intro .rule i:last-child{background:linear-gradient(270deg,transparent,#a8dcff)}
#intro .rule small{color:#bfe3ff}
body.pre .page,body.pre nav{opacity:0}

body.pg nav{z-index:45}

@media (max-width:359px){.brand b{display:none}.tab{font-size:9.5px;letter-spacing:-.03em}.seg button{min-width:36px;padding:0 8px}.ctrls{gap:6px}.page{gap:12px}.csum b{font-size:13px}.pgr{grid-template-columns:repeat(2,1fr)}}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;margin-bottom:12px;border-radius:12px;background:rgba(255,157,143,.08);border:1px solid rgba(255,157,143,.35);font-size:13px}

/* カレンダー */
.csum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.csum div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}

.cal .cw,.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cw span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.cal .cw span:first-child{color:#ff9d8f}.cal .cw span:last-child{color:var(--ice)}
.cd{position:relative;height:54px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cd b{font:500 13px var(--num)}.cd span{font-size:10px;color:var(--ice);letter-spacing:-.02em}
.cd.sun b{color:#ff9d8f}.cd.sat b{color:var(--ice)}
.cd.missing{background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 3px,transparent 3px 7px);border-style:dashed;border-color:rgba(var(--gold-rgb),.45)}

.cd .neg{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.cdet{margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.cdet>b{display:block;font:500 14px var(--body);margin-bottom:6px}
.cdet div{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:3px 0}
.cdet div span:last-child{color:var(--ink)}.cdet .hl span:last-child{color:var(--gold)}
/* 明細 */
.ltot{font-size:12px;color:var(--muted);margin-bottom:8px}.ltot b{color:var(--ink);font:400 13px var(--num)}
.lday{font-size:11.5px;color:var(--ice);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:8px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lrow i{width:7px;height:7px;border-radius:50%;grid-row:1 / span 2}
.lrow.sale i{background:var(--ice)}.lrow.exp i{background:var(--exp)}.lrow.lab i{background:var(--lab)}.lrow.miss i{background:none;border:1px dashed var(--gold)}
.lrow .nm{font-size:13.5px}.lrow .nm em{font-style:normal;font-size:10px;color:var(--ice);border:1px solid rgba(var(--ice-rgb),.4);border-radius:999px;padding:0 6px;margin-left:6px}
.lrow .sb{grid-column:2;font-size:11px;color:var(--muted)}
.lrow b{grid-row:1 / span 2;grid-column:3;font:400 14px var(--num)}
.lrow.sale b{color:var(--ice)}.lrow.miss .nm,.lrow.miss b{color:var(--gold)}
/* 給与 */
.pays{display:grid;gap:10px;margin-bottom:10px}

/* 前月比の説明ボタン */
.info::after{content:"";position:absolute;inset:-8px}

<script>
(() => {
"use strict";
/* =====================================================================
   VAULT 本番版 — データ・計算
   ===================================================================== */
const $ = id => document.getElementById(id);
document.documentElement.lang = "ja";
const APP_VER = "1.0.0";
const KEY = "vault-data-v1", UIKEY = "vault-ui-v1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const dim = (y, m) => new Date(y, m, 0).getDate();
const wd = (y, m, d) => new Date(y, m - 1, d).getDay();
const key = (y, m) => `${y}-${pad2(m)}`;
const isoD = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const WD = "日月火水木金土";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sum = (arr, f) => arr.reduce((a, r) => a + (f ? f(r) : r), 0);
function todayObj(){ const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() }; }
let TODAY = todayObj();
const todayIso = () => isoD(TODAY.y, TODAY.m, TODAY.d);
const isCur = (y, m) => y === TODAY.y && m === TODAY.m;

/* ---------------- 金額の表示 ---------------- */
const fmt = v => Math.round(Math.abs(v)).toLocaleString("ja-JP");
const yen = v => `${v < 0 ? "−" : ""}<span class="yen">¥</span>${fmt(v)}`;
const yenT = v => `${v < 0 ? "−" : ""}¥${fmt(v)}`;
const man = v => v === 0 ? "0" : Math.abs(v) >= 10000 ? (v / 10000).toLocaleString("ja-JP", { maximumFractionDigits: 1 }) + "万" : v.toLocaleString("ja-JP");
const hm = mins => `${Math.floor(mins / 60)}時間${mins % 60 ? mins % 60 + "分" : ""}`;
const hours = mins => Math.round(mins / 6) / 10;

/* ---------------- データの形 ---------------- */
const DEFAULT_CATS = ["仕入れ", "家賃", "水道光熱", "消耗品", "広告", "通信", "交通費", "修繕", "その他"];
const IND = { std: "標準", food: "飲食店", retail: "小売店", service: "サービス業", beauty: "美容・サロン" };
function fresh(){
  return { v: 2, biz: { name: "", industry: "std" }, stores: [], staff: [], cats: DEFAULT_CATS.slice(), costCats: ["仕入れ"], closedWd: [],
    sales: [], exps: [], shifts: [], pays: [], rules: { night: 25 }, meta: { created: todayIso(), start: todayIso(), lastBackup: null, setup: false, ownerH: {} } };
}
// 古いVAULT（売上帳）のバックアップも読めるように、足りない項目を補う
function normalize(x){
  const d = fresh(); if (!x || typeof x !== "object") return d;
  for (const k of ["stores", "staff", "sales", "exps", "shifts", "pays"]) d[k] = Array.isArray(x[k]) ? x[k] : [];
  if (Array.isArray(x.cats) && x.cats.length) d.cats = x.cats.map(String);
  if (Array.isArray(x.costCats)) d.costCats = x.costCats.map(String);
  if (Array.isArray(x.closedWd)) d.closedWd = x.closedWd.map(Number).filter(n => n >= 0 && n <= 6);
  if (x.biz) d.biz = { name: String(x.biz.name || ""), industry: IND[x.biz.industry] ? x.biz.industry : "std" };
  if (x.rules && isFinite(+x.rules.night)) d.rules.night = Math.max(0, Math.min(100, +x.rules.night));
  const dates = [...d.sales, ...d.exps, ...d.shifts, ...d.pays].map(r => r.date).filter(v => /^\d{4}-\d{2}-\d{2}$/.test(v)).sort();
  d.meta = Object.assign(d.meta, x.meta || {});
  if (!x.meta) { d.meta.setup = d.stores.length > 0; d.meta.start = dates[0] || todayIso(); }
  if (!d.meta.ownerH) d.meta.ownerH = {};
  d.stores.forEach(s => { s.id = s.id || uid(); s.name = String(s.name || "店舗"); });
  d.staff.forEach(s => { s.id = s.id || uid(); s.name = String(s.name || "スタッフ"); s.wage = Math.max(0, +s.wage || 0); s.transit = Math.max(0, +s.transit || 0); });
  ["sales", "exps", "pays"].forEach(k => d[k].forEach(r => { r.id = r.id || uid(); r.amount = Math.max(0, Math.round(+r.amount || 0)); }));
  d.shifts.forEach(r => { r.id = r.id || uid(); r.brk = Math.max(0, +r.brk || 0); });
  d.v = 2; return d;
}
let D = load();
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return fresh(); }
let UI = { intro: "full", bgm: true, calm: false, store: "all" };
try { Object.assign(UI, JSON.parse(localStorage.getItem(UIKEY) || "{}")); } catch (e) {}
const saveUI = () => { try { localStorage.setItem(UIKEY, JSON.stringify(UI)); } catch (e) {} };
let saveFailed = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); saveFailed = false; return true; }
  catch (e) { if (!saveFailed) setTimeout(() => toast("保存できませんでした。iPhoneの空き容量を確認し、設定からバックアップを保存してください"), 50); saveFailed = true; return false; }
}
// 日付ごとの索引（集計を速くする）
let IDX = { sales: {}, exps: {}, shifts: {}, pays: {} };
function reindex(){ IDX = { sales: {}, exps: {}, shifts: {}, pays: {} }; for (const t in IDX) for (const r of D[t]) (IDX[t][r.date] = IDX[t][r.date] || []).push(r); }
reindex();
// 変更の前に「元に戻す」ための控えを取り、変更後に保存する
function mutate(fn){ const snap = JSON.stringify(D); fn(); reindex(); save(); return () => { D = JSON.parse(snap); reindex(); save(); }; }

/* ---------------- 店舗の絞り込み ---------------- */
let STORE = UI.store;
function fixStore(){ if (STORE !== "all" && !D.stores.some(s => s.id === STORE)) STORE = "all"; }
fixStore();
const inStore = r => STORE === "all" || r.store === STORE;
const storeName = id => id === "all" ? "共通" : (D.stores.find(s => s.id === id)?.name || "削除した店舗");
const staffOf = id => D.staff.find(s => s.id === id);
const staffName = id => staffOf(id)?.name || "削除したスタッフ";

/* ---------------- 勤務の計算（深夜割増・交通費） ---------------- */
const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
function shiftCalc(r){
  const st = staffOf(r.staff) || {}, wage = +(r.wage ?? st.wage ?? 0), transit = +(r.transit ?? st.transit ?? 0), noNight = r.noNight ?? st.noNight ?? false;
  let s = toMin(r.start), e = toMin(r.end); if (e <= s) e += 1440;
  const span = e - s, brk = Math.min(span, Math.max(0, +r.brk || 0)), total = span - brk;
  let night = 0; for (const [a, b] of [[-120, 300], [1320, 1740], [2760, 3180]]) night += Math.max(0, Math.min(e, b) - Math.max(s, a));
  night = Math.min(night, total);
  const base = Math.round(total / 60 * wage), nightPay = noNight ? 0 : Math.round(night / 60 * wage * (D.rules.night || 0) / 100), tr = total > 0 ? transit : 0;
  return { total, night, base, nightPay, transit: tr, pay: base + nightPay + tr, wage };
}

/* ---------------- 1日分の集計 ----------------
   状態：ok＝売上あり / zero＝0円で記録（休み） / closed＝定休日 / missing＝未入力 / pending＝今日（まだ未入力） / before＝使い始める前 / future＝未来 */
function dayInfo(y, m, d){
  const iso = isoD(y, m, d), w = wd(y, m, d), t = todayIso();
  if (iso > t) return { d, w, iso, state: "future" };
  const sl = (IDX.sales[iso] || []).filter(inStore), ex = (IDX.exps[iso] || []).filter(inStore), sh = (IDX.shifts[iso] || []).filter(inStore), py = (IDX.pays[iso] || []).filter(inStore);
  const exp = sum(ex, r => r.amount), shc = sh.map(r => [r, shiftCalc(r)]), lab = sum(shc, x => x[1].pay) + sum(py, r => r.amount);
  let state, sales = null, guests = null;
  if (sl.length) { sales = sum(sl, r => r.amount); guests = sum(sl, r => +r.guests || 0); state = sales > 0 ? "ok" : "zero"; }
  else if (iso < D.meta.start) state = "before";
  else if (D.closedWd.includes(w)) { state = "closed"; sales = 0; guests = 0; }
  else if (iso === t) state = "pending";
  else state = "missing";
  return { d, w, iso, state, sales, guests, exp, lab, profit: (sales || 0) - exp - lab, closed: state === "closed" || state === "zero", rec: { sl, ex, sh: shc, py } };
}
function monthTot(y, m, upto){
  const n = dim(y, m), last = Math.min(upto || n, n), t = { sales: 0, exp: 0, lab: 0, guests: 0, open: 0, missing: [], cats: {}, staff: {}, days: 0, hasData: false };
  for (let d = 1; d <= last; d++) { const i = dayInfo(y, m, d); if (i.state === "future") continue;
    if (i.state === "missing") t.missing.push(d);
    t.sales += i.sales || 0; t.guests += i.guests || 0; if (i.sales > 0) t.open++;
    t.exp += i.exp; t.lab += i.lab; if (i.state !== "before") t.days++;
    if (i.rec.sl.length || i.rec.ex.length || i.rec.sh.length || i.rec.py.length) t.hasData = true;
    i.rec.ex.forEach(r => t.cats[r.cat] = (t.cats[r.cat] || 0) + r.amount);
    const S = id => t.staff[id] = t.staff[id] || { mins: 0, night: 0, base: 0, nightPay: 0, transit: 0, bonus: 0, fixed: 0, days: 0 };
    i.rec.sh.forEach(([r, c]) => { const s = S(r.staff); s.mins += c.total; s.night += c.night; s.base += c.base; s.nightPay += c.nightPay; s.transit += c.transit; s.days++; });
    i.rec.py.forEach(r => { const s = S(r.staff); if (r.kind === "bonus") s.bonus += r.amount; else s.fixed += r.amount; });
  }
  Object.values(t.staff).forEach(s => s.pay = s.base + s.nightPay + s.transit + s.bonus + s.fixed);
  t.profit = t.sales - t.exp - t.lab;
  return t;
}
const curTot = () => monthTot(cur.y, cur.m, isCur(cur.y, cur.m) ? TODAY.d : 0);
// 前月比：両方の月で売上が入力済みの同じ日付どうしを比べる（費用は同じ日付までの合計）
function compare(){
  const cy = cur.y, cm = cur.m, py = cm === 1 ? cy - 1 : cy, pm = cm === 1 ? 12 : cm - 1, upto = isCur(cy, cm) ? TODAY.d : dim(cy, cm);
  const a = { sales: 0, exp: 0, lab: 0, days: 0 }, b = { sales: 0, exp: 0, lab: 0 }, skip = ["missing", "pending", "before", "future"];
  for (let d = 1; d <= upto; d++) { const i = dayInfo(cy, cm, d); if (i.state === "future") continue; a.exp += i.exp; a.lab += i.lab;
    if (d > dim(py, pm)) continue; const j = dayInfo(py, pm, d); b.exp += j.exp; b.lab += j.lab;
    if (!skip.includes(i.state) && !skip.includes(j.state)) { a.sales += i.sales; b.sales += j.sales; a.days++; } }
  a.profit = a.sales - a.exp - a.lab; b.profit = b.sales - b.exp - b.lab;
  const p = (x, y) => y ? (x - y) / Math.abs(y) * 100 : null;
  return { sales: a.days ? p(a.sales, b.sales) : null, exp: p(a.exp, b.exp), lab: p(a.lab, b.lab), profit: a.days ? p(a.profit, b.profit) : null, a, b, pm, upto: Math.min(upto, dim(py, pm)) };
}
// いちばん古い月（使い始めた月か、それより前に入れた記録の月）
function firstKey(){ let m = D.meta.start; for (const t of ["sales", "exps", "shifts", "pays"]) for (const r of D[t]) if (r.date < m) m = r.date; return m.slice(0, 7); }

/* =====================================================================
   ホーム
   ===================================================================== */
let cur = { y: TODAY.y, m: TODAY.m }, metric = "sales", per = "d", cmode = "day", sel = null;
let CALM = UI.calm || matchMedia("(prefers-reduced-motion: reduce)").matches;
document.body.classList.toggle("calm", CALM);

const shown = {};
function animNum(id, val, html){
  const el = $(id), from = shown[id] ?? val * .92; shown[id] = val;
  if (CALM || from === val) { el.innerHTML = html(val); return; }
  const t0 = performance.now(), dur = 600;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.innerHTML = html(Math.round(from + (val - from) * e)); if (k < 1) requestAnimationFrame(step); else fitText(); };
  requestAnimationFrame(step);
}
const UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
const DN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
// 増減：矢印と符号を必ず付け、色は「良い・悪い」で決める（費用は減ると良い）
function chg(el, v, goodWhenUp, unit){
  unit = unit || "%";
  if (v === null || !isFinite(v)) { el.className = "chg flat"; el.innerHTML = "比較なし"; return; }

function download(name, text, type){ const b = new Blob([text], { type }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function doBackup(){
  D.meta.lastBackup = new Date().toISOString(); save();
  download(`VAULT-backup-${todayIso()}.json`, JSON.stringify({ app: "VAULT", ver: APP_VER, saved: D.meta.lastBackup, data: D }), "application/json");
  renderAll(false); if ($("sheet").classList.contains("on")) refreshPage();
  toast("バックアップを保存しました。「ファイル」アプリなど、iPhoneの外にも残しておくと安心です");
}
$("fRestore").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let x; try { const j = JSON.parse(await f.text()); x = j && j.data && j.app === "VAULT" ? j.data : j; if (!x || !Array.isArray(x.sales) || !Array.isArray(x.stores)) throw 0; } catch (er) { toast("このファイルは VAULT のバックアップとして読み込めませんでした"); return; }
  const nd = normalize(x), cnt = nd.sales.length + nd.exps.length + nd.shifts.length + nd.pays.length, dates = [...nd.sales, ...nd.exps, ...nd.shifts, ...nd.pays].map(r => r.date).sort();

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/";

    items.forEach(it => { const y = it.transform[5], x = it.transform[4]; let r = rows.find(r => Math.abs(r.y - y) < Math.max(2, (it.height || 8) * .45)); if (!r) rows.push(r = { y, its: [] }); r.its.push({ x, s: it.str, w: it.width || 0 }); });
    rows.sort((a, b) => b.y - a.y).forEach(r => { r.its.sort((a, b) => a.x - b.x); let s = "", lx = null; r.its.forEach(i => { if (lx !== null && i.x - lx > 3) s += " "; s += i.s; lx = i.x + i.w; }); out.push(s.replace(/\s+/g, " ").trim()); });

}
function findAmounts(s){
  s = Z2H(s).replace(/(20\d{2})\s*[\/\-.年]\s*\d{1,2}\s*[\/\-.月]\s*\d{1,2}\s*日?/g, " ").replace(/\d{1,2}:\d{2}/g, " ").replace(/(?:^|\s)\d{1,2}\s*[\/月]\s*\d{1,2}\s*日?/g, " ");

}
// 優先順位の高い言葉から順に探す（「現金売上」「カード売上」のような内訳の行は後回し）
const KW = [/総売上/, /売上合計|売上総額|総売上高/, /純売上|税込売上|売上金額|本日売上|売上高/, /^(?!.*(現金|カード|クレジット|電子|QR|商品|部門)).*売上/, /合計|総計/];
function parsePdf(lines){
  const cy = lines.map(l => (Z2H(l).match(/(20\d{2})\s*[\/\-.年]/) || [])[1]).find(Boolean) || cur.y, text = lines.join("\n");
  const hit = D.stores.find(s => s.name && text.includes(s.name)), store = hit ? hit.id : (STORE !== "all" ? STORE : D.stores[0]?.id);
  const tab = lines.map(l => ({ l, d: findDate(l, cy), a: findAmounts(l) })).filter(r => r.d && r.a.length && !/合計|総計|小計/.test(r.l));
